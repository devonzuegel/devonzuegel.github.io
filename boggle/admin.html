<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boggle Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ground:#141F1A; --surface:#1D2C25; --surface2:#27392F; --bone:#F2EDDF;
    --ink:#17201B; --amber:#E9A83A; --rust:#C8593F; --sage:#8CA598; --line:#31463B;
    --display: Futura, "Avenir Next Condensed", "Century Gothic", system-ui, sans-serif;
    --body: "Avenir Next", Avenir, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ground); color: var(--bone); font-family: var(--body); }
  #app { max-width: 960px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-family: var(--display); font-size: 28px; margin: 0 0 4px; }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--sage); text-transform: uppercase; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  /* tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--line); position: relative; }
  .tab { font-family: var(--mono); font-size: 12px; padding: 8px 18px; border: none; border-bottom: 2px solid transparent; color: var(--sage); cursor: pointer; background: none; margin-bottom: -1px; transition: color 150ms; }
  .tab:hover { color: var(--bone); }
  .tab.on { color: var(--amber); }
  .tab-indicator { position: absolute; bottom: -1px; height: 2px; background: var(--amber); transition: left 200ms ease, width 200ms ease; pointer-events: none; }
  /* cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .player-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .player-name { font-family: var(--display); font-size: 20px; }
  .player-meta { font-family: var(--mono); font-size: 11px; color: var(--sage); margin-top: 2px; }
  .sessions { display: none; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .sessions.open { display: block; }
  .session-row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: var(--mono); font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .session-row:last-child { border-bottom: none; }
  .session-info { color: var(--sage); flex: 1; }
  .session-score { color: var(--bone); white-space: nowrap; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .btn-delete { font-family: var(--mono); font-size: 11px; color: var(--rust); border: 1px solid var(--rust); border-radius: 999px; padding: 3px 10px; opacity: 0.7; }
  .btn-delete:hover { opacity: 1; }
  .btn-delete-player { font-family: var(--mono); font-size: 11px; color: var(--rust); border: 1px solid var(--rust); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  .btn-delete-player:hover { background: var(--rust); color: var(--ink); }
  .btn-test { font-family: var(--mono); font-size: 11px; border-radius: 999px; padding: 5px 12px; white-space: nowrap; border: 1px solid var(--line); color: var(--sage); }
  .btn-test:hover { border-color: var(--sage); color: var(--bone); }
  .btn-test.is-test { border-color: var(--sage); color: var(--sage); }
  .test-badge { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--sage); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 8px; vertical-align: middle; }
  .chevron { font-size: 12px; color: var(--sage); transition: transform 200ms; display: inline-block; }
  .chevron.open { transform: rotate(90deg); }
  .empty { font-family: var(--mono); font-size: 12px; color: var(--sage); padding: 8px 0; }
  .loading { font-family: var(--mono); font-size: 13px; color: var(--sage); margin-top: 40px; display: flex; justify-content: center; }
  .boggle-spinner { display: inline-flex; gap: 4px; margin-bottom: 16px; }
  .boggle-spinner .tile { width: 28px; height: 28px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--line);
    font-family: var(--display); font-size: 13px; font-weight: bold; color: var(--sage);
    display: flex; align-items: center; justify-content: center; transition: border-color 150ms, color 150ms; }
  .boggle-spinner .tile.lit { border-color: var(--amber); color: var(--amber); }
  .err { color: var(--rust); font-family: var(--mono); font-size: 12px; margin-top: 8px; }
  .refresh { font-family: var(--mono); font-size: 11px; color: var(--sage); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 110px; }
  .refresh:hover { color: var(--bone); border-color: var(--bone); }
  .refresh:disabled { opacity: 0.5; cursor: default; }
  .refresh .spin-icon { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .refresh.loading .spin-icon { animation: spin 700ms linear infinite; }
  /* audit log */
  .event-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }
  .event-row:last-child { border-bottom: none; }
  .event-ts { color: var(--sage); white-space: nowrap; min-width: 140px; }
  .event-player { color: var(--amber); min-width: 80px; }
  .event-type { min-width: 70px; }
  .event-loc { color: var(--sage); }
  .event-type.signup { color: var(--amber); }
  .event-type.session { color: var(--bone); }
  /* stats tab */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .stats-grid.wide { grid-template-columns: 1fr; }
  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
  .stat-card .stat-val { font-family: var(--display); font-size: 32px; color: var(--amber); }
  .stat-card .stat-lbl { font-family: var(--mono); font-size: 10px; color: var(--sage); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .chart-card canvas { width: 100%; display: block; }
  @media (max-width: 600px) { .stat-cards { grid-template-columns: repeat(2, 1fr); } .stats-grid { grid-template-columns: 1fr; } }
  /* map */
  #map { height: 480px; border-radius: 12px; border: 1px solid var(--line); margin-top: 4px; }
  .leaflet-container { background: #1D2C25; }
  .map-popup { font-family: var(--mono); font-size: 12px; color: var(--ink); }
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div>
      <div class="eyebrow">boggle trainer</div>
      <h1>Admin</h1>
    </div>
    <div style="display:flex;gap:8px">
      <button class="refresh" id="refresh-btn" onclick="loadAll()">Refresh</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" onclick="showTab('players', this)">Players</button>
    <button class="tab" onclick="showTab('audit', this)">Audit log</button>
    <button class="tab" onclick="showTab('stats', this)">Stats</button>
    <button class="tab" onclick="showTab('map', this)">Map</button>
    <div class="tab-indicator" id="tab-indicator"></div>
  </div>

  <div id="tab-players"><div class="loading" id="spinner-players"></div></div>
  <div id="tab-audit" style="display:none"><div class="loading" id="spinner-audit"></div></div>
  <div id="tab-stats" style="display:none"></div>
  <div id="tab-map" style="display:none">
    <div id="map"></div>
  </div>
</div>


<script>
var API = "https://boggle-api.vercel.app/api";
var expanded = {};
var allPlayers = [];
var allEvents = [];

var ADMIN_TOKEN_KEY = "boggle:adminToken";
function getAdminToken(){ try { return localStorage.getItem(ADMIN_TOKEN_KEY) || ""; } catch(e){ return ""; } }
function setAdminToken(t){ try { localStorage.setItem(ADMIN_TOKEN_KEY, t); } catch(e){} }
function authHeaders(){ return { "Content-Type": "application/json", "X-Admin-Token": getAdminToken() }; }
function apiFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, authHeaders(), opts.headers || {});
  return fetch(url, opts).then(function(r){
    if (r.status === 403) {
      var newToken = prompt("Admin password:");
      if (!newToken) return Promise.reject("cancelled");
      setAdminToken(newToken);
      opts.headers["X-Admin-Token"] = newToken;
      return fetch(url, opts);
    }
    return r;
  });
}
var mapInstance = null;

function moveTabIndicator(btn) {
  var indicator = document.getElementById("tab-indicator");
  var tabs = document.getElementById("tabs");
  if (!indicator || !tabs || !btn) return;
  var tabsRect = tabs.getBoundingClientRect();
  var btnRect = btn.getBoundingClientRect();
  indicator.style.left = (btnRect.left - tabsRect.left) + "px";
  indicator.style.width = btnRect.width + "px";
}

function showTab(name, btn) {
  ["players","audit","stats","map"].forEach(function(t){
    document.getElementById("tab-" + t).style.display = t === name ? "" : "none";
  });
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.remove("on"); });
  btn.classList.add("on");
  moveTabIndicator(btn);
  location.hash = name;
  if (name === "map") initMap();
  if (name === "stats") renderStats();
}

function isThisYear(ts) { return new Date(ts).getFullYear() === new Date().getFullYear(); }
function fmt(ts) {
  if (!ts) return "—";
  var opts = { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" };
  if (!isThisYear(ts)) opts.year = "numeric";
  return new Date(ts).toLocaleString(undefined, opts);
}
function fmtDate(ts) {
  if (!ts) return "—";
  var opts = { month: "short", day: "numeric" };
  if (!isThisYear(ts)) opts.year = "numeric";
  return new Date(ts).toLocaleDateString(undefined, opts);
}
var COUNTRY_CODES = {
  "Afghanistan":"AF","Albania":"AL","Algeria":"DZ","Argentina":"AR","Armenia":"AM",
  "Australia":"AU","Austria":"AT","Azerbaijan":"AZ","Bahrain":"BH","Bangladesh":"BD",
  "Belarus":"BY","Belgium":"BE","Bolivia":"BO","Bosnia and Herzegovina":"BA","Brazil":"BR",
  "Bulgaria":"BG","Cambodia":"KH","Cameroon":"CM","Canada":"CA","Chile":"CL","China":"CN",
  "Colombia":"CO","Costa Rica":"CR","Croatia":"HR","Cuba":"CU","Cyprus":"CY",
  "Czech Republic":"CZ","Czechia":"CZ","Denmark":"DK","Dominican Republic":"DO",
  "Ecuador":"EC","Egypt":"EG","El Salvador":"SV","Estonia":"EE","Ethiopia":"ET",
  "Finland":"FI","France":"FR","Georgia":"GE","Germany":"DE","Ghana":"GH","Greece":"GR",
  "Guatemala":"GT","Honduras":"HN","Hong Kong":"HK","Hungary":"HU","Iceland":"IS",
  "India":"IN","Indonesia":"ID","Iran":"IR","Iraq":"IQ","Ireland":"IE","Israel":"IL",
  "Italy":"IT","Jamaica":"JM","Japan":"JP","Jordan":"JO","Kazakhstan":"KZ","Kenya":"KE",
  "Kuwait":"KW","Latvia":"LV","Lebanon":"LB","Lithuania":"LT","Luxembourg":"LU",
  "Malaysia":"MY","Malta":"MT","Mexico":"MX","Moldova":"MD","Morocco":"MA",
  "Netherlands":"NL","New Zealand":"NZ","Nicaragua":"NI","Nigeria":"NG","Norway":"NO",
  "Pakistan":"PK","Panama":"PA","Paraguay":"PY","Peru":"PE","Philippines":"PH",
  "Poland":"PL","Portugal":"PT","Puerto Rico":"PR","Qatar":"QA","Romania":"RO",
  "Russia":"RU","Saudi Arabia":"SA","Senegal":"SN","Serbia":"RS","Singapore":"SG",
  "Slovakia":"SK","Slovenia":"SI","South Africa":"ZA","South Korea":"KR","Spain":"ES",
  "Sri Lanka":"LK","Sweden":"SE","Switzerland":"CH","Taiwan":"TW","Tanzania":"TZ",
  "Thailand":"TH","Tunisia":"TN","Turkey":"TR","Türkiye":"TR","Uganda":"UG","Ukraine":"UA",
  "United Arab Emirates":"AE","United Kingdom":"GB","United States":"US","United States of America":"US",
  "Uruguay":"UY","Uzbekistan":"UZ","Venezuela":"VE","Vietnam":"VN","Yemen":"YE","Zimbabwe":"ZW"
};
function countryFlag(name) {
  var code = COUNTRY_CODES[name];
  if (!code) return null;
  return String.fromCodePoint(
    0x1F1E6 + code.charCodeAt(0) - 65,
    0x1F1E6 + code.charCodeAt(1) - 65
  );
}
function locStr(loc) {
  if (!loc) return "";
  if (loc.city || loc.country) {
    var flag = loc.country ? countryFlag(loc.country) : null;
    var parts = [loc.city, flag || loc.country].filter(Boolean);
    return parts.join(" ");
  }
  return loc.lat ? loc.lat.toFixed(2) + ", " + loc.lon.toFixed(2) : "";
}

function loadAll() {
  var refreshBtn = document.getElementById("refresh-btn");
  if (refreshBtn) {
    refreshBtn.disabled = true;
    refreshBtn.classList.add("loading");
    refreshBtn.innerHTML = '<span class="spin-icon">↻</span> Refreshing…';
  }
  function doneRefreshing() {
    if (refreshBtn) {
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("loading");
      refreshBtn.innerHTML = 'Refresh';
    }
  }
  startSpinner("spinner-players");
  startSpinner("spinner-audit");
  apiFetch(API + "/admin?action=list")
    .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(players) {
      allPlayers = players;
      return Promise.all(players.map(function(p) {
        return apiFetch(API + "/admin?action=player&user=" + encodeURIComponent(p.player))
          .then(function(r) { return r.json(); })
          .then(function(d) { p.fullData = d; return p; });
      }));
    })
    .then(function(players) {
      allPlayers = players;
      // collect all events across all players
      allEvents = [];
      players.forEach(function(p) {
        (p.fullData && p.fullData.events || []).forEach(function(e) { allEvents.push(e); });
      });
      allEvents.sort(function(a,b){ return b.ts - a.ts; });
      stopSpinner("spinner-players");
      stopSpinner("spinner-audit");
      doneRefreshing();
      renderPlayers();
      renderAudit();
      renderStats();
      var activeTab = location.hash.replace("#", "") || "players";
      if (activeTab === "map") { if (mapInstance) { mapInstance.remove(); mapInstance = null; } initMap(); }
      else if (mapInstance) { mapInstance.remove(); mapInstance = null; }
    })
    .catch(function(e) {
      stopSpinner("spinner-players");
      stopSpinner("spinner-audit");
      doneRefreshing();
      document.getElementById("tab-players").innerHTML = '<div class="err">Error: ' + e + '</div>';
    });
}

/* ---- players tab ---- */
var playerSort = "lastGame"; // "lastGame" | "joined" | "games"
var playerFilter = "real"; // "real" | "all" | "test"
function renderPlayers() {
  var el = document.getElementById("tab-players");
  el.innerHTML = "";
  if (!allPlayers.length) { el.innerHTML = '<div class="empty">No players yet.</div>'; return; }

  // controls bar
  var controlsBar = document.createElement("div");
  controlsBar.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:12px;font-family:monospace;font-size:11px;color:#8CA598;flex-wrap:wrap";

  // sort controls
  controlsBar.appendChild(Object.assign(document.createElement("span"), { textContent: "sort by:" }));
  [["lastGame","last game"],["joined","date joined"],["games","# games"]].forEach(function(opt) {
    var btn = document.createElement("button");
    btn.textContent = opt[1];
    btn.style.cssText = "font-family:monospace;font-size:11px;padding:2px 8px;border-radius:999px;cursor:pointer;border:1px solid " + (playerSort === opt[0] ? "#E9A83A" : "#31463B") + ";background:none;color:" + (playerSort === opt[0] ? "#E9A83A" : "#8CA598");
    btn.onclick = function() { playerSort = opt[0]; renderPlayers(); };
    controlsBar.appendChild(btn);
  });

  // spacer
  var spacer = document.createElement("span");
  spacer.style.cssText = "flex:1;min-width:8px";
  controlsBar.appendChild(spacer);

  // show filter
  var testCount = allPlayers.filter(function(p){ return !!(p.fullData && p.fullData.isTest); }).length;
  var realCount = allPlayers.length - testCount;
  var counts = { real: realCount, all: allPlayers.length, test: testCount };
  controlsBar.appendChild(Object.assign(document.createElement("span"), { textContent: "show:" }));
  [["real","real"],["all","all"],["test","test"]].forEach(function(opt) {
    var active = playerFilter === opt[0];
    var btn = document.createElement("button");
    btn.style.cssText = "font-family:monospace;font-size:11px;padding:2px 8px;border-radius:999px;cursor:pointer;border:1px solid " + (active ? "#E9A83A" : "#31463B") + ";background:none;color:" + (active ? "#E9A83A" : "#8CA598") + ";display:inline-flex;align-items:center;gap:5px";
    var label = document.createElement("span"); label.textContent = opt[1];
    var pill = document.createElement("span");
    pill.textContent = counts[opt[0]];
    pill.style.cssText = "font-size:10px;padding:1px 5px;border-radius:999px;background:" + (active ? "#E9A83A" : "#27392F") + ";color:" + (active ? "#141F1A" : "#8CA598") + ";font-weight:bold;line-height:1.4";
    btn.appendChild(label); btn.appendChild(pill);
    btn.onclick = function() { playerFilter = opt[0]; renderPlayers(); };
    controlsBar.appendChild(btn);
  });

  el.appendChild(controlsBar);

  var visible = allPlayers.filter(function(p) {
    var isTest = !!(p.fullData && p.fullData.isTest);
    if (playerFilter === "real") return !isTest;
    if (playerFilter === "test") return isTest;
    return true;
  });

  if (!visible.length) {
    var msg = playerFilter === "test" ? "No test players." : playerFilter === "real" ? "No real players yet." : "No players yet.";
    el.appendChild(Object.assign(document.createElement("div"), { className: "empty", textContent: msg }));
    return;
  }

  var sorted = visible.slice().sort(function(a, b) {
    var da = a.fullData || {}, db = b.fullData || {};
    if (playerSort === "joined") return (db.createdAt || 0) - (da.createdAt || 0);
    if (playerSort === "games") {
      var ca = (da.sessions || []).filter(function(s){ return !s.early; }).length;
      var cb = (db.sessions || []).filter(function(s){ return !s.early; }).length;
      return cb - ca;
    }
    // lastGame
    var la = (da.sessions || []).reduce(function(m,s){ return s.ts>m?s.ts:m; }, 0);
    var lb = (db.sessions || []).reduce(function(m,s){ return s.ts>m?s.ts:m; }, 0);
    return lb - la;
  });
  sorted.forEach(function(p) { el.appendChild(makePlayerCard(p)); });
}

function makePlayerCard(p) {
  var d = p.fullData || {};
  var card = document.createElement("div");
  card.className = "card";

  var header = document.createElement("div");
  header.className = "player-header";

  var left = document.createElement("div");
  var nameEl = document.createElement("div"); nameEl.className = "player-name";
  nameEl.appendChild(document.createTextNode(p.player));
  if (d.isTest) {
    var badge = document.createElement("span"); badge.className = "test-badge"; badge.textContent = "test";
    nameEl.appendChild(badge);
  }
  var loc = d.location ? " · " + locStr(d.location) : "";
  var synced = d.lastSyncedAt ? " · synced " + fmt(d.lastSyncedAt) : " · never synced";
  var sessions = (d.sessions || []);
  var lastTs = sessions.reduce(function(max, s){ return s.ts > max ? s.ts : max; }, 0);
  var nonEarlyCount = sessions.filter(function(s){ return !s.early; }).length;
  var meta = document.createElement("div"); meta.className = "player-meta";
  function amberIf(cond, text) {
    var s = document.createElement("span");
    s.textContent = text;
    if (cond) s.style.color = "#E9A83A";
    return s;
  }
  meta.appendChild(amberIf(playerSort === "games", nonEarlyCount + " game" + (nonEarlyCount !== 1 ? "s" : "")));
  if (lastTs) { meta.appendChild(amberIf(playerSort === "lastGame", " · last played " + fmtDate(lastTs))); }
  meta.appendChild(amberIf(playerSort === "joined", " · joined " + fmtDate(d.createdAt)));
  meta.appendChild(document.createTextNode(loc + synced));
  left.appendChild(nameEl); left.appendChild(meta);

  var right = document.createElement("div");
  right.style.cssText = "display:flex;gap:8px;align-items:center";

  var chevron = document.createElement("span");
  chevron.className = "chevron" + (expanded[p.player] ? " open" : "");
  chevron.textContent = "▶";

  var testBtn = document.createElement("button");
  testBtn.className = "btn-test" + (d.isTest ? " is-test" : "");
  testBtn.textContent = d.isTest ? "Unmark test" : "Mark as test";
  testBtn.onclick = function(e) {
    e.stopPropagation();
    var newVal = !d.isTest;
    apiFetch(API + "/admin?action=set_flag&user=" + encodeURIComponent(p.player) + "&flag=isTest&value=" + newVal, { method: "POST" })
      .then(function(r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function() {
        d.isTest = newVal;
        p.fullData.isTest = newVal;
        // if marking as test while in "real" view, or unmarking while in "test" view — animate out
        var willDisappear = (newVal && playerFilter === "real") || (!newVal && playerFilter === "test");
        if (willDisappear) {
          card.style.cssText += ";overflow:hidden;transition:max-height 300ms ease,opacity 300ms ease,margin-bottom 300ms ease,padding 300ms ease;max-height:" + card.offsetHeight + "px";
          requestAnimationFrame(function() {
            card.style.maxHeight = "0";
            card.style.opacity = "0";
            card.style.marginBottom = "0";
            card.style.paddingTop = "0";
            card.style.paddingBottom = "0";
          });
          setTimeout(function() { card.remove(); renderPlayers(); }, 320);
        } else {
          renderPlayers();
        }
      })
      .catch(function(e) { alert("Error: " + e); });
  };

  var delBtn = document.createElement("button");
  delBtn.className = "btn-delete-player"; delBtn.textContent = "Delete player";
  delBtn.onclick = function(e) {
    e.stopPropagation();
    if (!confirm("Delete " + p.player + " and all their data?")) return;
    apiFetch(API + "/admin?action=delete_player&user=" + encodeURIComponent(p.player), { method: "POST" })
      .then(function(r) { return r.ok ? Promise.resolve() : Promise.reject(r.status); })
      .then(function() { card.remove(); })
      .catch(function(e) { alert("Error: " + e); });
  };

  right.appendChild(testBtn); right.appendChild(delBtn); right.appendChild(chevron);
  header.appendChild(left); header.appendChild(right);
  card.appendChild(header);

  var sessions = document.createElement("div");
  sessions.className = "sessions" + (expanded[p.player] ? " open" : "");

  header.onclick = function() {
    expanded[p.player] = !expanded[p.player];
    chevron.className = "chevron" + (expanded[p.player] ? " open" : "");
    sessions.className = "sessions" + (expanded[p.player] ? " open" : "");
    if (expanded[p.player] && !sessions.dataset.loaded) renderSessions(p, sessions);
  };

  card.appendChild(sessions);
  if (expanded[p.player]) renderSessions(p, sessions);
  return card;
}

function renderSessions(p, container) {
  container.dataset.loaded = "1";
  container.innerHTML = "";
  var list = (p.fullData && p.fullData.sessions) || [];
  if (!list.length) { container.innerHTML = '<div class="empty">No games.</div>'; return; }
  list.forEach(function(s) {
    var row = document.createElement("div"); row.className = "session-row";
    var info = document.createElement("div"); info.className = "session-info";
    info.textContent = fmt(s.ts) + (s.loc ? " · " + locStr(s.loc) : "") + (s.early ? " · ended early" : "");
    var score = document.createElement("div"); score.className = "session-score";
    score.textContent = s.found5 + "/" + s.total5 + " at 5+ · " + s.score + " pts";
    var del = document.createElement("button"); del.className = "btn-delete"; del.textContent = "Delete";
    del.onclick = function() {
      if (!confirm("Delete this game?")) return;
      apiFetch(API + "/admin?action=delete_session&user=" + encodeURIComponent(p.player) + "&id=" + encodeURIComponent(s.id), { method: "POST" })
        .then(function(r) { return r.ok ? Promise.resolve() : Promise.reject(r.status); })
        .then(function() { row.remove(); })
        .catch(function(e) { alert("Error: " + e); });
    };
    row.appendChild(info); row.appendChild(score); row.appendChild(del);
    container.appendChild(row);
  });
}

/* ---- stats tab ---- */
function renderStats() {
  var el = document.getElementById("tab-stats");
  if (!el) return;
  el.innerHTML = "";

  var note = document.createElement("div");
  note.style.cssText = "font-family:var(--mono);font-size:11px;color:var(--sage);opacity:0.6;margin-bottom:16px";
  note.textContent = "Excludes test players and unfinished games.";
  el.appendChild(note);

  // Color constants (hex — canvas can't read CSS vars)
  var C = {
    amber: "#E9A83A",
    sage: "#8CA598",
    bone: "#F2EDDF",
    line: "#31463B",
    surface2: "#27392F",
    rust: "#C8593F",
    bg: "#1D2C25"
  };

  // Real players only
  var players = allPlayers.filter(function(p){ return !(p.fullData && p.fullData.isTest); });

  // Flatten all non-early sessions from real players
  var allSessions = [];
  players.forEach(function(p) {
    (p.fullData && p.fullData.sessions || []).forEach(function(s) {
      if (!s.early) allSessions.push({ s: s, player: p.player });
    });
  });

  var now = Date.now();

  // ── 1. Summary stat cards ──────────────────────────────────────────────
  var totalPlayers = players.length;
  var totalGames = allSessions.length;
  var avgScore = totalGames ? Math.round(allSessions.reduce(function(a, x){ return a + (x.s.score || 0); }, 0) / totalGames) : 0;
  var total5plus = allSessions.reduce(function(a, x){ return a + (x.s.found5 || 0); }, 0);

  var cardsRow = document.createElement("div");
  cardsRow.className = "stat-cards";
  [
    [totalPlayers, "Total players"],
    [totalGames, "Games played"],
    [avgScore, "Avg score / game"],
    [total5plus, "5+ letter words found"]
  ].forEach(function(pair) {
    var card = document.createElement("div"); card.className = "stat-card";
    var val = document.createElement("div"); val.className = "stat-val"; val.textContent = pair[0].toLocaleString();
    var lbl = document.createElement("div"); lbl.className = "stat-lbl"; lbl.textContent = pair[1];
    card.appendChild(val); card.appendChild(lbl);
    cardsRow.appendChild(card);
  });
  el.appendChild(cardsRow);

  // ── Early-end rate & retention (inline stat cards) ──────────────────────
  var allSessionsIncEarly = [];
  players.forEach(function(p) {
    (p.fullData && p.fullData.sessions || []).forEach(function(s) { allSessionsIncEarly.push(s); });
  });
  var earlyCount = allSessionsIncEarly.filter(function(s){ return s.early; }).length;
  var earlyPct = allSessionsIncEarly.length ? Math.round(earlyCount / allSessionsIncEarly.length * 100) : 0;

  // D7 retention: players signed up > 7 days ago who played a 2nd game within 7 days of signup
  var D7_MS = 7 * 24 * 3600 * 1000;
  var D30_MS = 30 * 24 * 3600 * 1000;
  function retention(windowMs) {
    var eligible = players.filter(function(p){ return p.fullData && p.fullData.createdAt && (now - p.fullData.createdAt) > windowMs; });
    if (!eligible.length) return null;
    var retained = eligible.filter(function(p) {
      var signup = p.fullData.createdAt;
      var sessions = (p.fullData.sessions || []).filter(function(s){ return !s.early; }).sort(function(a,b){ return a.ts - b.ts; });
      // need at least 2 sessions, second session within windowMs of signup
      return sessions.length >= 2 && (sessions[1].ts - signup) <= windowMs;
    });
    return Math.round(retained.length / eligible.length * 100);
  }
  var d7r = retention(D7_MS);
  var d30r = retention(D30_MS);

  // Recency buckets
  var SOD = new Date(); SOD.setHours(0,0,0,0); var sodMs = SOD.getTime();
  var SOW = new Date(SOD); SOW.setDate(SOD.getDate() - ((SOD.getDay() + 6) % 7)); var sowMs = SOW.getTime();
  var SOM = new Date(SOD); SOM.setDate(1); var somMs = SOM.getTime();
  var recency = { today: 0, week: 0, month: 0, dormant: 0 };
  players.forEach(function(p) {
    var sessions = (p.fullData && p.fullData.sessions || []).filter(function(s){ return !s.early; });
    if (!sessions.length) { recency.dormant++; return; }
    var last = sessions.reduce(function(m, s){ return s.ts > m ? s.ts : m; }, 0);
    if (last >= sodMs) recency.today++;
    else if (last >= sowMs) recency.week++;
    else if (last >= somMs) recency.month++;
    else recency.dormant++;
  });

  // Row of inline stats: early-end, D7, D30, recency
  var inlineGrid = document.createElement("div");
  inlineGrid.className = "stat-cards";
  inlineGrid.style.gridTemplateColumns = "repeat(4,1fr)";

  function makeInlineCard(val, lbl) {
    var card = document.createElement("div"); card.className = "stat-card";
    var v = document.createElement("div"); v.className = "stat-val"; v.style.fontSize = "28px"; v.textContent = val;
    var l = document.createElement("div"); l.className = "stat-lbl"; l.textContent = lbl;
    card.appendChild(v); card.appendChild(l);
    return card;
  }
  inlineGrid.appendChild(makeInlineCard(earlyPct + "%", "Games abandoned"));
  inlineGrid.appendChild(makeInlineCard(d7r !== null ? d7r + "%" : "—", "D7 retention"));
  inlineGrid.appendChild(makeInlineCard(d30r !== null ? d30r + "%" : "—", "D30 retention"));
  // Recency breakdown as text
  var recCard = document.createElement("div"); recCard.className = "stat-card";
  recCard.innerHTML = '<div class="stat-lbl" style="margin-bottom:8px">Player recency</div>' +
    '<div style="font-family:var(--mono);font-size:11px;text-align:left;display:flex;flex-direction:column;gap:3px">' +
    '<span style="color:#E9A83A">▸ <b>' + recency.today + '</b> today</span>' +
    '<span style="color:#8CA598">▸ <b>' + recency.week + '</b> this week</span>' +
    '<span style="color:#8CA598">▸ <b>' + recency.month + '</b> this month</span>' +
    '<span style="color:#31463B">▸ <b>' + recency.dormant + '</b> dormant</span>' +
    '</div>';
  inlineGrid.appendChild(recCard);
  el.appendChild(inlineGrid);

  // ── Chart helpers ──────────────────────────────────────────────────────
  function makeChartCard(label, canvasId, h) {
    var card = document.createElement("div"); card.className = "chart-card";
    var ey = document.createElement("div"); ey.className = "eyebrow"; ey.style.marginBottom = "10px"; ey.textContent = label;
    var cv = document.createElement("canvas"); cv.id = canvasId; cv.style.height = (h || 160) + "px";
    card.appendChild(ey); card.appendChild(cv);
    return { card: card, canvas: cv };
  }

  function setupCanvas(cv) {
    var w = cv.parentElement.clientWidth - 32; // card padding 16*2
    var h = cv.offsetHeight || parseInt(cv.style.height, 10) || 160;
    cv.width = w * 2; cv.height = h * 2;
    cv.style.width = w + "px";
    var ctx = cv.getContext("2d"); ctx.scale(2, 2);
    return { ctx: ctx, w: w, h: h };
  }

  function drawBarChart(cv, labels, values, color, opts) {
    opts = opts || {};
    var d = setupCanvas(cv);
    var ctx = d.ctx, W = d.w, H = d.h;
    var pad = { t: 8, r: 8, b: opts.rotateLabels ? 56 : 28, l: 36 };
    var chartW = W - pad.l - pad.r, chartH = H - pad.t - pad.b;
    var max = Math.max.apply(null, values.concat([1]));

    // grid
    ctx.strokeStyle = C.line; ctx.lineWidth = 0.5;
    var ticks = 4;
    for (var i = 0; i <= ticks; i++) {
      var y = pad.t + chartH - (i / ticks) * chartH;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + chartW, y); ctx.stroke();
      ctx.fillStyle = C.sage; ctx.font = "9px " + "'SF Mono',monospace";
      ctx.textAlign = "right"; ctx.fillText(Math.round(i / ticks * max), pad.l - 4, y + 3);
    }

    var n = values.length;
    var barW = Math.max(2, (chartW / n) * 0.65);
    var gap = chartW / n;

    values.forEach(function(v, i) {
      var x = pad.l + i * gap + (gap - barW) / 2;
      var bH = (v / max) * chartH;
      var y = pad.t + chartH - bH;
      var r = Math.min(3, barW / 2);
      // rounded top
      ctx.fillStyle = color || C.amber;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + barW - r, y);
      ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
      ctx.lineTo(x + barW, y + bH);
      ctx.lineTo(x, y + bH);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath(); ctx.fill();

      // label
      ctx.fillStyle = C.sage; ctx.font = "9px 'SF Mono',monospace";
      if (opts.rotateLabels) {
        ctx.save();
        ctx.translate(x + barW / 2, pad.t + chartH + 6);
        ctx.rotate(-Math.PI / 4);
        ctx.textAlign = "right";
        ctx.fillText(labels[i], 0, 0);
        ctx.restore();
      } else {
        ctx.textAlign = "center";
        ctx.fillText(labels[i], x + barW / 2, pad.t + chartH + 12);
      }
    });
  }

  function drawLineChart(cv, labels, values, color, opts) {
    opts = opts || {};
    var d = setupCanvas(cv);
    var ctx = d.ctx, W = d.w, H = d.h;
    var pad = { t: 8, r: 8, b: 28, l: 36 };
    var chartW = W - pad.l - pad.r, chartH = H - pad.t - pad.b;
    var max = Math.max.apply(null, values.concat([1]));
    var min = opts.zeroBase ? 0 : Math.min.apply(null, values.concat([0]));
    var range = max - min || 1;

    // grid
    ctx.strokeStyle = C.line; ctx.lineWidth = 0.5;
    var ticks = 4;
    for (var i = 0; i <= ticks; i++) {
      var yv = min + (i / ticks) * range;
      var y = pad.t + chartH - ((yv - min) / range) * chartH;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + chartW, y); ctx.stroke();
      ctx.fillStyle = C.sage; ctx.font = "9px 'SF Mono',monospace"; ctx.textAlign = "right";
      ctx.fillText(Math.round(yv), pad.l - 4, y + 3);
    }

    function xPos(i) { return pad.l + (values.length > 1 ? i / (values.length - 1) * chartW : chartW / 2); }
    function yPos(v) { return pad.t + chartH - ((v - min) / range) * chartH; }

    // area fill
    ctx.beginPath();
    ctx.moveTo(xPos(0), pad.t + chartH);
    values.forEach(function(v, i) { ctx.lineTo(xPos(i), yPos(v)); });
    ctx.lineTo(xPos(values.length - 1), pad.t + chartH);
    ctx.closePath();
    ctx.fillStyle = (color || C.amber) + "26"; // ~15% opacity
    ctx.fill();

    // line
    ctx.beginPath();
    values.forEach(function(v, i) {
      if (i === 0) ctx.moveTo(xPos(i), yPos(v));
      else ctx.lineTo(xPos(i), yPos(v));
    });
    ctx.strokeStyle = color || C.amber; ctx.lineWidth = 1.5; ctx.stroke();

    // dots
    values.forEach(function(v, i) {
      ctx.beginPath(); ctx.arc(xPos(i), yPos(v), 2.5, 0, Math.PI * 2);
      ctx.fillStyle = color || C.amber; ctx.fill();
    });

    // x labels (subset to avoid crowding)
    ctx.fillStyle = C.sage; ctx.font = "9px 'SF Mono',monospace"; ctx.textAlign = "center";
    var step = Math.ceil(labels.length / 6);
    labels.forEach(function(lbl, i) {
      if (i % step === 0 || i === labels.length - 1) {
        ctx.fillText(lbl, xPos(i), pad.t + chartH + 14);
      }
    });

    // return point positions + redraw fn for hover overlays
    var pts = values.map(function(v, i) { return { x: xPos(i), y: yPos(v), label: labels[i], value: v }; });
    return {
      points: pts, pad: pad, chartH: chartH, W: W, H: H,
      drawOverlay: function(closest) {
        // redraw base chart then overlay
        ctx.clearRect(0, 0, W * 2, H * 2);
        // grid
        ctx.strokeStyle = C.line; ctx.lineWidth = 0.5;
        for (var gi = 0; gi <= ticks; gi++) {
          var gy = pad.t + chartH - (gi / ticks) * chartH;
          ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(pad.l + chartW, gy); ctx.stroke();
          ctx.fillStyle = C.sage; ctx.font = "9px 'SF Mono',monospace"; ctx.textAlign = "right";
          ctx.fillText(Math.round(min + gi / ticks * range), pad.l - 4, gy + 3);
        }
        // area
        ctx.beginPath();
        ctx.moveTo(xPos(0), pad.t + chartH);
        values.forEach(function(v, i) { ctx.lineTo(xPos(i), yPos(v)); });
        ctx.lineTo(xPos(values.length - 1), pad.t + chartH);
        ctx.closePath(); ctx.fillStyle = (color || C.amber) + "26"; ctx.fill();
        // line
        ctx.beginPath();
        values.forEach(function(v, i) { if (i===0) ctx.moveTo(xPos(i),yPos(v)); else ctx.lineTo(xPos(i),yPos(v)); });
        ctx.strokeStyle = color || C.amber; ctx.lineWidth = 1.5; ctx.stroke();
        // dots
        values.forEach(function(v, i) {
          ctx.beginPath(); ctx.arc(xPos(i), yPos(v), 2.5, 0, Math.PI*2);
          ctx.fillStyle = color || C.amber; ctx.fill();
        });
        // x labels
        ctx.fillStyle = C.sage; ctx.font = "9px 'SF Mono',monospace"; ctx.textAlign = "center";
        var step2 = Math.ceil(labels.length / 6);
        labels.forEach(function(lbl, i) {
          if (i % step2 === 0 || i === labels.length - 1) ctx.fillText(lbl, xPos(i), pad.t + chartH + 14);
        });
        // vertical dashed line
        if (closest) {
          ctx.save();
          ctx.setLineDash([3, 3]);
          ctx.strokeStyle = C.sage; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(closest.x, pad.t); ctx.lineTo(closest.x, pad.t + chartH);
          ctx.stroke(); ctx.restore();
          // highlighted dot
          ctx.beginPath(); ctx.arc(closest.x, closest.y, 4, 0, Math.PI*2);
          ctx.fillStyle = C.amber; ctx.fill();
          ctx.beginPath(); ctx.arc(closest.x, closest.y, 4, 0, Math.PI*2);
          ctx.strokeStyle = "#1D2C25"; ctx.lineWidth = 1.5; ctx.stroke();
        }
      }
    };
  }

  function addLineChartHover(cv, chartData, formatTip) {
    if (!chartData) return;
    var tip = document.createElement("div");
    tip.style.cssText = "position:absolute;background:#1D2C25;border:1px solid #31463B;border-radius:6px;padding:4px 8px;font-family:monospace;font-size:11px;color:#F2EDDF;pointer-events:none;display:none;white-space:nowrap;z-index:10";
    var container = cv.parentElement;
    container.style.position = "relative";
    container.appendChild(tip);

    cv.addEventListener("mousemove", function(e) {
      var cvRect = cv.getBoundingClientRect();
      var conRect = container.getBoundingClientRect();
      // canvas logical coords → screen px → container-relative px
      var scale = cvRect.width / (cv.width / 2);
      var mx = (e.clientX - cvRect.left) / scale;
      var closest = null, minDx = Infinity;
      chartData.points.forEach(function(p) {
        var dx = Math.abs(p.x - mx);
        if (dx < minDx) { minDx = dx; closest = p; }
      });
      if (closest && minDx < 40) {
        chartData.drawOverlay(closest);
        // point position in container-relative px
        var px = cvRect.left - conRect.left + closest.x * scale;
        var py = cvRect.top  - conRect.top  + closest.y * scale;
        tip.textContent = formatTip ? formatTip(closest) : closest.label + ": " + closest.value;
        tip.style.display = "block";
        var tipLeft = px + 8;
        if (tipLeft + tip.offsetWidth > conRect.width - 4) tipLeft = px - tip.offsetWidth - 8;
        tip.style.left = tipLeft + "px";
        tip.style.top  = Math.max(py - 20, 2) + "px";
      } else {
        chartData.drawOverlay(null);
        tip.style.display = "none";
      }
    });
    cv.addEventListener("mouseleave", function() { chartData.drawOverlay(null); tip.style.display = "none"; });
  }

  // ── Week helpers ────────────────────────────────────────────────────────
  function getMonday(date) {
    var d = new Date(date);
    var day = d.getDay();
    var diff = (day === 0) ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function weekLabel(monDate) {
    return monDate.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function last12Weeks() {
    var weeks = [];
    var monday = getMonday(new Date());
    for (var i = 11; i >= 0; i--) {
      var d = new Date(monday);
      d.setDate(monday.getDate() - i * 7);
      weeks.push(d);
    }
    return weeks;
  }

  // ── Build charts ──────────────────────────────────────────────────────
  var grid1 = document.createElement("div"); grid1.className = "stats-grid";
  var grid2 = document.createElement("div"); grid2.className = "stats-grid";
  var wideDiv = document.createElement("div"); wideDiv.className = "stats-grid wide";

  // ── Chart A: Cumulative signups ─────────────────────────────────────────
  // Build day-by-day buckets from first signup to today
  var signupTimes = players
    .filter(function(p){ return p.fullData && p.fullData.createdAt; })
    .map(function(p){ return p.fullData.createdAt; })
    .sort(function(a,b){ return a - b; });

  var cumLabels = [], cumValues = [];
  if (signupTimes.length) {
    var firstDay = new Date(signupTimes[0]); firstDay.setHours(0,0,0,0);
    var today = new Date(); today.setHours(0,0,0,0);
    var d = new Date(firstDay);
    var running = 0;
    while (d <= today) {
      var dEnd = new Date(d); dEnd.setDate(d.getDate() + 1);
      signupTimes.forEach(function(ts) {
        if (ts >= d.getTime() && ts < dEnd.getTime()) running++;
      });
      cumLabels.push(d.toLocaleDateString(undefined, { month: "short", day: "numeric" }));
      cumValues.push(running);
      d.setDate(d.getDate() + 1);
    }
  }

  var cA = makeChartCard("Cumulative signups", "chart-signup", 160);
  grid1.appendChild(cA.card);

  // ── Chart B: Games per week ─────────────────────────────────────────────
  var weeks12 = last12Weeks();
  var gamesPerWeek = weeks12.map(function(mon) {
    var end = new Date(mon); end.setDate(mon.getDate() + 7);
    return allSessions.filter(function(x){ return x.s.ts >= mon.getTime() && x.s.ts < end.getTime(); }).length;
  });

  var cB = makeChartCard("Games per week (last 12 weeks)", "chart-gpw", 190);
  grid1.appendChild(cB.card);

  // ── Chart C: Score distribution ────────────────────────────────────────
  var buckets = [0,50,100,150,200,250,300,400,500];
  var scoreDist = buckets.map(function(low, i) {
    var high = buckets[i + 1] || Infinity;
    return allSessions.filter(function(x){ var sc = x.s.score || 0; return sc >= low && sc < high; }).length;
  });
  var scoreLabels = buckets.map(function(low, i) {
    return i === buckets.length - 1 ? low + "+" : low + "–" + buckets[i+1];
  });

  var cC = makeChartCard("Score distribution", "chart-scores", 160);
  grid2.appendChild(cC.card);

  // ── Chart D: Games per player distribution ─────────────────────────────
  var gpPerPlayer = players.map(function(p) {
    return (p.fullData && p.fullData.sessions || []).filter(function(s){ return !s.early; }).length;
  });
  var maxGP = Math.max.apply(null, gpPerPlayer.concat([1]));
  var gpDist = [], gpDistLabels = [];
  // bucket by 1 up to 10, then 11-20, 21+
  for (var g = 0; g <= Math.min(maxGP, 10); g++) {
    gpDist.push(gpPerPlayer.filter(function(v){ return v === g; }).length);
    gpDistLabels.push(String(g));
  }
  if (maxGP > 10) {
    gpDist.push(gpPerPlayer.filter(function(v){ return v > 10; }).length);
    gpDistLabels.push("11+");
  }

  var cD = makeChartCard("Games per player", "chart-gpp", 160);
  grid2.appendChild(cD.card);

  // ── Chart E: Avg score per week ────────────────────────────────────────
  var avgScorePerWeek = weeks12.map(function(mon) {
    var end = new Date(mon); end.setDate(mon.getDate() + 7);
    var ws = allSessions.filter(function(x){ return x.s.ts >= mon.getTime() && x.s.ts < end.getTime(); });
    if (!ws.length) return 0;
    return Math.round(ws.reduce(function(a, x){ return a + (x.s.score || 0); }, 0) / ws.length);
  });

        modeKeys.forEach(function(mk, mi) {
          var val = ri === 0 ? heatmapData[mk].on : heatmapData[mk].off;
          var opacity = hmMax > 0 ? 0.1 + 0.85 * (val / hmMax) : 0.1;
          var cx = padL + mi * cellW;
          var cy = padT + ri * cellH;
          ctx.fillStyle = C.amber;
          ctx.globalAlpha = val > 0 ? opacity : 0.05;
          ctx.fillRect(cx + 2, cy + 2, cellW - 4, cellH - 4);
          ctx.globalAlpha = 1;
          // Count label
          ctx.fillStyle = val > hmMax * 0.5 ? "#1D2C25" : C.bone;
          ctx.font = "11px monospace"; ctx.textAlign = "center";
          ctx.fillText(val > 0 ? val : "—", cx + cellW / 2, cy + cellH / 2 + 4);
        });
      });
    }());
  }, 0);
}

/* ---- map tab ---- */
function initMap() {
  if (mapInstance) return;
  mapInstance = L.map("map", { zoomControl: true }).setView([20, 0], 2);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd", maxZoom: 19
  }).addTo(mapInstance);

  var points = [];
  allEvents.forEach(function(e) {
    if (!e.loc || !e.loc.lat) return;
    var color = e.type === "signup" ? "#E9A83A" : "#8CA598";
    var marker = L.circleMarker([e.loc.lat, e.loc.lon], {
      radius: e.type === "signup" ? 8 : 6,
      fillColor: color, color: color, weight: 1, opacity: 0.9, fillOpacity: 0.7
    }).addTo(mapInstance);
    var label = e.type === "signup"
      ? "<b>" + (e.player || "") + "</b> signed up<br>" + fmt(e.ts) + (e.loc.city ? "<br>" + locStr(e.loc) : "")
      : "<b>" + (e.player || "") + "</b> played<br>" + fmt(e.ts) + "<br>" + (e.score || 0) + " pts" + (e.loc.city ? "<br>" + locStr(e.loc) : "");
    marker.bindPopup('<div class="map-popup">' + label + '</div>');
    points.push([e.loc.lat, e.loc.lon]);
  });

  if (points.length) mapInstance.fitBounds(points, { padding: [40, 40], maxZoom: 8 });
}

/* ---- boggle spinner ---- */
// makeBoggleSpinner(letters?) → { el, stop }
// Returns a spinner element ready to append anywhere, plus a stop() to cancel it.
// Default letters spell "LOADING..."
var SPINNER_LETTERS = ["L","O","A","D","I","N","G","…"];
function makeBoggleSpinner(letters) {
  letters = letters || SPINNER_LETTERS;
  var grid = document.createElement("div"); grid.className = "boggle-spinner";
  var tiles = letters.map(function(ch) {
    var t = document.createElement("div"); t.className = "tile"; t.textContent = ch;
    if (ch === "…") t.style.fontSize = "9px";
    grid.appendChild(t); return t;
  });
  var i = 0;
  var timer = setInterval(function() {
    tiles.forEach(function(t){ t.classList.remove("lit"); });
    tiles[i % tiles.length].classList.add("lit");
    i++;
  }, 120);
  return { el: grid, stop: function() { clearInterval(timer); } };
}

// Convenience: mount a spinner into a container element, replacing its contents.
// Returns a stop() function.
function showSpinnerIn(container) {
  var spinner = makeBoggleSpinner();
  container.innerHTML = "";
  container.appendChild(spinner.el);
  return spinner.stop;
}

var _spinnerStops = {};
function startSpinner(id) {
  var el = document.getElementById(id);
  if (!el) return;
  _spinnerStops[id] = showSpinnerIn(el);
}
function stopSpinner(id) {
  if (_spinnerStops[id]) { _spinnerStops[id](); delete _spinnerStops[id]; }
}

// Restore tab from URL hash, then position indicator (no animation on first paint)
(function() {
  var TABS = ["players","audit","stats","map"];
  var hash = location.hash.replace("#", "");
  if (hash && TABS.indexOf(hash) !== -1) {
    var targetBtn = document.querySelector(".tab[onclick*=\"'" + hash + "'\"]");
    if (targetBtn) {
      TABS.forEach(function(t){ document.getElementById("tab-" + t).style.display = t === hash ? "" : "none"; });
      document.querySelectorAll(".tab").forEach(function(b){ b.classList.remove("on"); });
      targetBtn.classList.add("on");
    }
  }
  var indicator = document.getElementById("tab-indicator");
  if (indicator) indicator.style.transition = "none";
  moveTabIndicator(document.querySelector(".tab.on"));
  requestAnimationFrame(function() {
    if (indicator) indicator.style.transition = "";
  });
})();

loadAll();
