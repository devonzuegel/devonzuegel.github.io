<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <filter id="tileShad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="tileGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#F5F0E4"/>
      <stop offset="100%" stop-color="#DDD5BC"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="36" fill="#0E1F17"/>
  <rect x="18" y="18" width="144" height="144" rx="25" fill="#C8BFA7" filter="url(#tileShad)"/>
  <rect x="18" y="16" width="144" height="144" rx="25" fill="url(#tileGrad)" filter="url(#noise)"/>
  <rect x="18" y="16" width="144" height="144" rx="25" fill="none" stroke="#B8AF97" stroke-width="1" opacity="0.6"/>
  <text x="90" y="94" text-anchor="middle" dominant-baseline="central"
    font-family="Futura, 'Century Gothic', 'Avenir Next Condensed', system-ui, sans-serif"
    font-weight="700" font-size="102" fill="#0D1C13" opacity="0.15"
    dy="3">B</text>
  <text x="90" y="92" text-anchor="middle" dominant-baseline="central"
    font-family="Futura, 'Century Gothic', 'Avenir Next Condensed', system-ui, sans-serif"
    font-weight="700" font-size="102" fill="#12211A">B</text>
</svg>
