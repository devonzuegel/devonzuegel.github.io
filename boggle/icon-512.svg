<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="tileShad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="textDeboss" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="3" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#fff" flood-opacity="0.12"/>
    </filter>
    <radialGradient id="tileGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#F5F0E4"/>
      <stop offset="100%" stop-color="#DDD5BC"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- dark bg -->
  <rect width="512" height="512" rx="102" fill="#0E1F17"/>
  <!-- tile shadow -->
  <rect x="52" y="52" width="408" height="408" rx="72" fill="#C8BFA7" filter="url(#tileShad)"/>
  <!-- tile face with gradient -->
  <rect x="52" y="48" width="408" height="408" rx="72" fill="url(#tileGrad)" filter="url(#noise)"/>
  <!-- bottom edge for depth -->
  <rect x="52" y="48" width="408" height="408" rx="72" fill="none" stroke="#B8AF97" stroke-width="1.5" opacity="0.6"/>
  <!-- B with deboss effect -->
  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
    font-family="Futura, 'Century Gothic', 'Avenir Next Condensed', system-ui, sans-serif"
    font-weight="700" font-size="290" fill="#0D1C13" opacity="0.15"
    dy="8">B</text>
  <text x="256" y="258" text-anchor="middle" dominant-baseline="central"
    font-family="Futura, 'Century Gothic', 'Avenir Next Condensed', system-ui, sans-serif"
    font-weight="700" font-size="290" fill="#12211A">B</text>
</svg>
