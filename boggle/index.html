<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{
    --ground:#141F1A; --surface:#1D2C25; --surface2:#27392F; --bone:#F2EDDF;
    --boneEdge:#CFC5AE; --ink:#17201B; --amber:#E9A83A; --rust:#C8593F;
    --sage:#8CA598; --line:#31463B;
    --display: Futura, "Avenir Next Condensed", "Century Gothic", system-ui, sans-serif;
    --body: "Avenir Next", Avenir, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ground);color:var(--bone);font-family:var(--body);overscroll-behavior:none}
  body{min-height:100vh;min-height:100dvh}
  :root{--hdr-h:calc(env(safe-area-inset-top) + 44px);--nav-h:calc(env(safe-area-inset-bottom) + 52px);
    --full-h:100vh;--full-h:100dvh}
  #app{max-width:520px;margin:0 auto;padding:16px 20px 130px}
  #app.wide{max-width:960px;padding-bottom:0}
  @media (min-width:600px){
    #app.wide{padding-left:0;padding-right:0}
  }
  .hdr{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--ground);
    padding:calc(env(safe-area-inset-top) + 8px) 16px 6px;border-bottom:1px solid var(--line)}
  .hdr-spacer{height:var(--hdr-h)}
  /* floating countdown — stays put while the page scrolls */
  #clockPill{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;z-index:45;
    display:none;font-family:var(--mono);font-size:16px;color:var(--amber);
    background:rgba(20,31,26,.86);border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;box-shadow:0 4px 14px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
  #clockPill.on{display:block}
  #clockPill.low{color:var(--rust);border-color:var(--rust)}
  #unsyncedPill{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:45;
    display:none;font-family:var(--mono);font-size:11px;color:var(--amber);
    background:rgba(20,31,26,.92);border:1px solid var(--amber);border-radius:999px;
    padding:5px 12px;box-shadow:0 4px 14px rgba(0,0,0,.4);backdrop-filter:blur(6px);
    cursor:pointer}
  #unsyncedPill.on{display:block}
  #unsyncedPill.offline{color:var(--rust);border-color:var(--rust)}
  /* game over */
  #modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(9,15,12,.76);padding:24px}
  #modal.on{display:flex}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;
    max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);
    animation:popin 320ms cubic-bezier(.2,.9,.3,1)}
  @keyframes popin{0%{transform:scale(.86) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
  .modal-panel-left,.modal-panel-right{align-items:center}
  @media(max-width:440px){.modal-panel-left,.modal-panel-right{align-items:flex-start}}
  .mtitle{font-family:var(--display);font-size:42px;line-height:1;color:var(--amber);margin:0px 0 18px}
  .mnote{font-family:var(--mono);font-size:11px;color:var(--sage);margin-top:14px}
  /* review: board parked, words scroll beside it */
  .reviewLayout{display:flex;flex-direction:column;gap:0;align-items:stretch;
    height:calc(var(--full-h) - var(--hdr-h) - var(--nav-h))}
  .reviewLeft{flex-shrink:0;width:100%;background:var(--ground);
    padding:6px 0 20px;border-bottom:1px solid var(--line)}
  .reviewLeft .trayWrap{max-width:min(480px,calc(100vh - var(--hdr-h) - var(--nav-h) - 160px));margin:0 auto}
  .reviewRight{flex:1;min-height:0;overflow-y:auto;width:100%;padding-top:16px}
  @media (min-width:600px){
    .reviewLayout{flex-direction:row;gap:0;align-items:stretch;height:calc(var(--full-h) - var(--hdr-h) - var(--nav-h));
      padding:0 16px}
    .reviewLeft{position:fixed;top:var(--hdr-h);bottom:var(--nav-h);
      width:min(42%,420px);left:max(0px,calc(50vw - 480px));
      border-bottom:none;padding:24px 24px 16px 16px;
      display:flex;flex-direction:column;justify-content:flex-start;z-index:20;
      background:var(--ground)}
    .reviewLeft .trayWrap{max-width:min(420px,calc(var(--full-h) - 200px));width:100%}
    .reviewLeft-spacer{width:min(42%,420px);flex-shrink:0}
    .reviewRight{flex:1;min-width:0;overflow-y:auto;padding:8px 0 24px 40px}
    .idleSpacer{height:16px}
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--sage);text-transform:uppercase;margin-bottom:6px}
  #friend-code-input::placeholder{color:var(--sage);opacity:0.5;font-weight:600}
  .section{margin-top:40px}
  .section>.eyebrow{margin-bottom:6px}
  .h1{font-family:var(--display);font-size:26px}
  .mono{font-family:var(--mono)}
  .sage{color:var(--sage)}
  .row{display:flex;align-items:center;gap:8px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .stack>*+*{margin-top:16px}
  .clock{font-family:var(--mono);font-size:28px;color:var(--amber)}
  .clock.low{color:var(--rust)}
  .btn{font-family:var(--display);letter-spacing:.04em;border-radius:999px;padding:12px 22px;font-size:16px;
       background:var(--amber);color:var(--ink);border:1px solid var(--amber)}
  .btn.ghost{background:none;color:var(--bone);border:1px solid var(--line)}
  .btn.small{padding:6px 12px;font-size:13px}
  .chipbtn{font-family:var(--mono);font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--sage)}
  .chipbtn.on{border-color:var(--amber);color:var(--amber)}
  .seg-ctrl{display:inline-flex;border:1px solid var(--line);border-radius:6px 6px 0 0;overflow:hidden;font-family:var(--mono);font-size:10px;margin-bottom:-1px;position:relative}
  .seg-ctrl button{background:none;border:none;padding:3px 8px;color:var(--sage);cursor:pointer;transition:color .2s;letter-spacing:.04em;position:relative;z-index:1}
  .seg-ctrl button.on{color:#0C1510;font-weight:600}
  .seg-ctrl-slider{position:absolute;top:0;bottom:0;background:var(--amber);border-radius:5px 5px 0 0;transition:left .2s cubic-bezier(.4,0,.2,1),width .2s cubic-bezier(.4,0,.2,1);z-index:0;pointer-events:none}
  #toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 70px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--surface2);color:var(--bone);font-family:var(--mono);font-size:13px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .filter-badge{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:3px 8px;opacity:.85;line-height:1;display:inline-flex;align-items:center}
  .recent-table{width:100%;border-collapse:collapse;font-size:12px}
  .recent-table th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);padding:4px 8px;font-weight:normal;white-space:nowrap;border-bottom:1px solid var(--line)}
  .recent-table td{padding:5px 8px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
  .recent-table tbody tr:first-child td{border-top:none}
  .recent-table tbody tr:hover td{background:var(--surface2)}
  .filter-matrix-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .2s ease;padding-left:14px}
  .filter-matrix-wrap.open{max-height:400px;opacity:1;margin:10px 0 14px}
  .filter-matrix{display:inline-grid;border:1px solid var(--line);border-radius:10px;padding:15px 10px 7px 10px}
  .filter-matrix-row{display:contents}
  .filter-matrix-corner{} /* empty top-left cell */
  .filter-matrix-col-hdr{font-family:var(--mono);font-size:10px;color:var(--sage);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:0 4px 2px}
  .filter-matrix-row-hdr{font-family:var(--mono);font-size:10px;color:var(--sage);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;padding-right:6px;white-space:nowrap}
  .filter-matrix-cell{padding:3px 10px;text-align:center;cursor:pointer;transition:color .15s,border-color .15s;border:1px solid transparent;border-radius:6px}
  .filter-matrix-cell:hover:not(.empty){color:var(--bone)}
  .filter-matrix-cell.selected{border-color:var(--amber)}
  .filter-matrix-cell.empty{opacity:.35;cursor:default}
  .filter-matrix-count{font-family:var(--mono);font-size:13px;color:var(--bone)}
  .filter-matrix-cell.selected .filter-matrix-count{color:var(--amber)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat .v{font-family:var(--display);font-size:28px;line-height:1.1;margin-top:4px;white-space:nowrap}
  .stat .s{font-size:12px;color:var(--sage);white-space:nowrap}
  .p{color:var(--sage);font-size:14px;line-height:1.5}

  .trayWrap{max-width:380px;margin:0 auto;width:100%}
  .label{height:24px;margin-top:-18px;text-align:center;font-family:var(--mono);font-size:16px;letter-spacing:.12em;color:var(--amber)}
  .label.bad{color:var(--rust)}
  .boardBox{position:relative}
  .shakeBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    border:none;z-index:2;white-space:nowrap;
    box-shadow:0 0 0 6px rgba(20,31,26,.8),0 0 16px rgb(255 255 255 / 100%)}
  .idleBoard{opacity:0.25}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:16px;
    background:var(--surface2);box-shadow:inset 0 2px 10px rgba(0,0,0,.45);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  .board.live,.board.live .tile{touch-action:none}
  .tile{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:12px;
    background:var(--bone);color:var(--ink);box-shadow:0 2px 0 var(--boneEdge),0 4px 8px rgba(0,0,0,.35);
    transition:background 140ms ease, transform 140ms ease}
  .tile span{font-family:var(--display);font-weight:600;font-size:2rem;letter-spacing:-.02em}
  .board.paused .tile span{visibility:hidden}
  .board.paused{position:relative}
  .board.paused::after{content:"PAUSED";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.1em;color:var(--bone);background:rgba(20,31,26,.55);border-radius:12px;pointer-events:none;text-shadow:0 0 20px var(--ground),0 0 40px var(--ground),0 0 60px var(--ground),0 2px 8px var(--ground)}
  .tile.q span{font-size:1.5rem}
  .tile.lit{background:var(--amber)}
  .tile.litbad{background:var(--rust)}
  .tile.litdupe{background:#5b9bd5}
  svg.trace{position:absolute;inset:0;width:100%;height:100%;padding:12px;pointer-events:none}

  .word{font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface2)}
  .word.big{background:var(--amber);color:var(--ink)}
  .wrap{display:flex;flex-wrap:wrap;gap:8px}
  .missrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:0px solid var(--line);
    padding:8px 12px}
  .missrow:first-child{border-radius:10px 10px 0 0}
  .missrow:last-child{border-radius:0 0 10px 10px}
  .missrow:first-child:last-child{border-radius:10px}
  .missrow+.missrow{border-top:1px solid var(--line)}
  .missrow.sel{background:var(--surface2)}
  .missrow .w{flex:1;text-align:left;font-family:var(--mono);font-size:15px}
  .tag{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sage)}
  .tag.knew{border-color:var(--amber);color:var(--amber)}
  .tag.new{border-color:var(--rust);color:var(--rust)}
  .flash{height:18px;font-size:13px;color:var(--rust);font-family:var(--mono)}
  .flash.dupe{color:#5b9bd5}
  input.entry{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--bone);border-radius:12px;
    padding:12px 14px;font-family:var(--mono);font-size:16px;outline:none}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--line);padding:12px 0 calc(env(safe-area-inset-bottom) + 12px)}
  nav button{font-family:var(--display);font-size:15px;letter-spacing:.05em;color:var(--sage)}
  nav button.on{color:var(--amber)}
  .center{text-align:center}
  /* celebration */
  #toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 92px);
    display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;z-index:50}
  .toast{display:flex;align-items:baseline;gap:10px;padding:8px 16px;border-radius:999px;
    background:var(--amber);color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.45);
    animation:toastin 1.2s cubic-bezier(.2,.8,.2,1) forwards}
  .toast .tw{font-family:var(--mono);font-size:14px;letter-spacing:.1em}
  .toast .tp{font-family:var(--display);font-size:18px;font-weight:700}
  .toast .tl{font-family:var(--mono);font-size:10px;opacity:.7;letter-spacing:.1em}
  .toast.t1{padding:6px 14px;background:#D9CBA6}
  .toast.t3{padding:12px 22px;background:linear-gradient(100deg,var(--amber),#F2D06B);animation-duration:1.8s}
  .toast.t3 .tp{font-size:26px}
  @keyframes toastin{
    0%{transform:translateY(16px) scale(.85);opacity:0}
    12%{transform:translateY(0) scale(1.06);opacity:1}
    24%{transform:translateY(0) scale(1)}
    78%{opacity:1}
    100%{transform:translateY(-14px);opacity:0}}
  .notify{font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:999px;
    box-shadow:0 6px 20px rgba(0,0,0,.45);animation:toastin 2.8s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
  .notify.ok{background:var(--surface2);color:var(--bone);border:1px solid var(--line)}
  .notify.err{background:#3a1a14;color:var(--rust);border:1px solid var(--rust)}
  .spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:60;
    animation:fly 850ms cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
  .bump{display:inline-block;animation:bump 420ms ease}
  @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.22);color:var(--amber)}100%{transform:scale(1)}}
  .word{animation:chipin 260ms cubic-bezier(.2,.8,.2,1)}
  @keyframes chipin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .runscore{font-family:var(--display);font-size:20px;color:var(--amber)}
  /* quiz bar */
  #qbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:40;
    display:none;justify-content:center;padding:0 16px;pointer-events:none}
  #qbar.on{display:flex}
  #qbar .inner{pointer-events:auto;display:flex;align-items:center;gap:12px;
    background:var(--bone);border:none;border-radius:14px;padding:10px 14px;
    box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #qbar .q{flex:1;font-family:var(--mono);font-size:12px;color:var(--ink)}
  #qbar .q b{color:var(--ink);font-size:14px}
  .masked{letter-spacing:.22em}
  .missrow{flex-wrap:wrap}
  .tag{font-size:10px}
  .early{color:var(--rust)}
  .playerbtn{font-family:var(--mono);font-size:11px;color:var(--sage);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;margin-top:8px}
  .playerbtn b{color:var(--amber);font-weight:400}
  .nameinput{width:100%;background:var(--ground);border:1px solid var(--line);color:var(--bone);
    border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:16px;outline:none;text-align:center}
  .who{font-family:var(--mono);font-size:11px;color:var(--sage)}
  .dtitle{font-family:var(--display);font-size:34px;color:var(--bone);margin:2px 0 14px;letter-spacing:.02em}
  .dbody{text-align:left;max-height:46vh;overflow:auto}
  .pos{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase;margin:10px 0 4px}
  .dline{font-size:14px;line-height:1.45;color:var(--bone);margin-bottom:6px}
  .src{font-family:var(--mono);font-size:9px;color:var(--sage);margin-top:12px}
  .got{color:var(--amber)}
  .shown{color:var(--sage)}
  /* progress */
  .heat{display:grid;grid-template-rows:repeat(7,9px);grid-auto-flow:column;gap:3px;overflow:hidden}
  .heat i{width:9px;height:9px;border-radius:2px;background:#22332B;display:block}
  .legend{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--sage);margin-top:8px}
  .legend i{width:9px;height:9px;border-radius:2px;display:block}
  .delta{font-family:var(--mono);font-size:12px}
  .up{color:var(--amber)} .down{color:var(--rust)}
  .linkbtn{font-family:var(--mono);font-size:11px;color:var(--sage);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .linkbtn.on{color:var(--amber);border-color:var(--amber)}
  @media (max-width:599px){ .pause-label{display:none} .pause-btn svg{margin-right:0!important} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  @keyframes highlight-pop {
    0%   { transform: scale(1);    box-shadow: none; }
    30%  { transform: scale(1.03); box-shadow: 0 0 0 3px var(--sage); }
    60%  { transform: scale(1.03); box-shadow: 0 0 0 3px var(--sage); }
    100% { transform: scale(1);    box-shadow: none; }
  }
  .highlight-pop { animation: highlight-pop 1.2s ease both; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="qbar"><div class="inner"></div></div>
<div id="clockPill"></div>
<div id="unsyncedPill" onclick="syncUp()"></div>
<div id="modal"></div>
<nav id="nav"></nav>
<script>
var BOARD_WORDS = [
  "ACORN","ALDER","ALGAE","AMBER","ANGEL","ASPEN","ATLAS","ATOLL","AURAS","AZURE",
  "BADGER","BASIN","BEACH","BEARS","BEECH","BIRCH","BISON","BLOOM","BLUFF","BOARS",
  "BOLES","BRANT","BROOK","BROOM","BRUSH","BUTTE","BREAM","BRIAR","BULBS","BUCKS",
  "BURRO","BURNS","CAIRN","CAMAS","CEDAR","CHALK","CHASM","CLEFT","CLIFF","CLOUD",
  "COAST","COBRA","COPSE","CORAL","CRANE","CREEK","CREST","CROFT","CROWN","DAISY",
  "DELTA","DUNES","EAGLE","EBONY","EGRET","ELDER","EMBER","ESKER","FAUNA","FERNS",
  "FIELD","FINCH","FJORD","FLAME","FLATS","FLINT","FLOOD","FLORA","FLUME","FORGE",
  "FOXES","FROND","FROST","FUNGI","GALES","GARNET","GECKO","GEODE","GLADE","GLEAM",
  "GLEN","GLINT","GLOBE","GLOOM","GNOME","GOATS","GORGE","GRAIL","GRASS","GREBE",
  "GROVE","GUSTS","HARES","HAVEN","HAWKS","HAZEL","HEATH","HEDGE","HERON","HOLLY",

var data = { sessions: [], queue: [], vocab: [], defs: {}, includeEarly: false, player: "", players: [], scoring: { zero3: false, zero4: false } };
var storageOk = true;
try {
  var raw = localStorage.getItem(KEY);
  if (raw) data = Object.assign(data, JSON.parse(raw));
  data.scoring = { zero3: false, zero4: false };
} catch (e) { storageOk = false; }

/* ---------------- cloud sync ---------------- */
var API = "https://boggle-api.vercel.app/api/boggle";
var DEVON_TOKEN_KEY = "boggle:devonToken";
function getDevonToken(){ try { return localStorage.getItem(DEVON_TOKEN_KEY) || ""; } catch(e){ return ""; } }
function setDevonToken(t){ try { localStorage.setItem(DEVON_TOKEN_KEY, t); } catch(e){} }
var BUILD = "2026-08-07T01:58:17Z"; /* updated by deploy script */
var PENDING_KEY = "boggle:pendingSync";
var syncState = { status: "idle", lastSync: null, error: null, pending: false, offline: !navigator.onLine };
var syncDebounce = null;

/* restore pending flag + last server sync time across page loads */
try { if (localStorage.getItem(PENDING_KEY) === "1") syncState.pending = true; } catch(e) {}
try { var _lss = localStorage.getItem("boggle:lastServerSync"); if (_lss) syncState.lastSync = Number(_lss); } catch(e) {}

function unsyncedSessions(){
  if (!syncState.lastSync) return data.sessions.slice();
  return data.sessions.filter(function(s){ return s.ts > syncState.lastSync; });
}

function setPending(val){
  syncState.pending = val;
  try { if (val) localStorage.setItem(PENDING_KEY, "1"); else localStorage.removeItem(PENDING_KEY); } catch(e) {}
  renderUnsyncedPill();
}

var _pillHideTimer = null;
function renderUnsyncedPill(){
  var pill = document.getElementById("unsyncedPill");
  if (!pill) return;
  if (syncState.offline && syncState.pending) {
    clearTimeout(_pillHideTimer);
    pill.textContent = "offline · changes saved locally";
    pill.className = "on offline";
  } else if (syncState.pending) {
    clearTimeout(_pillHideTimer);
    pill.textContent = "syncing…";
    pill.className = "on";
  } else {
    clearTimeout(_pillHideTimer);
    pill.textContent = "synced ✓";
    pill.className = "on";
    _pillHideTimer = setTimeout(function(){ pill.className = ""; }, 1500);
  }
}

function renderSyncStatus(){
  var el = document.getElementById("syncStatus");
  if (!el) return;
  if (syncState.status === "syncing") { el.textContent = "syncing…"; el.style.color = "var(--sage)"; }
  else if (syncState.status === "ok") { el.textContent = "synced " + fmtAgo(syncState.lastSync); el.style.color = "var(--sage)"; }
  else if (syncState.status === "error") { el.textContent = syncState.offline ? "offline" : "sync error"; el.style.color = "var(--rust)"; }
  else { el.textContent = ""; }
}

/* online/offline events */
window.addEventListener("online", function(){
  syncState.offline = false;
  renderUnsyncedPill();
  /* tell SW to flush its queue */
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: "FLUSH_QUEUE" });
  }
  /* also try a direct syncUp in case SW queue is empty but we have pending local changes */
  if (syncState.pending) syncUp();
});
window.addEventListener("offline", function(){
  syncState.offline = true;
  renderUnsyncedPill();
});

/* messages from SW */
if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener("message", function(e) {
    if (e.data && e.data.type === "SYNC_QUEUED") {
      setPending(true);
    } else if (e.data && e.data.type === "SYNC_FLUSHED") {
      setPending(false);
      syncState.status = "ok"; syncState.lastSync = Date.now();
      try { localStorage.setItem("boggle:lastServerSync", String(syncState.lastSync)); } catch(e) {}
      renderSyncStatus();
    }
  });
}

function mergeData(remote){
  /* sessions: union by id, keep newest 200 */
  var seenId = {};
  data.sessions.forEach(function(s){ seenId[s.id] = s; });
  (remote.sessions || []).forEach(function(s){
    if (!seenId[s.id]) data.sessions.push(s);
    else Object.assign(seenId[s.id], s);
  });
  data.sessions.sort(function(a,b){ return b.ts - a.ts; });
  data.sessions = data.sessions.slice(0, 200);

  /* vocab: union by word */
  var seenW = {};
  data.vocab.forEach(function(v){ seenW[v.word] = v; });
  (remote.vocab || []).forEach(function(v){
    if (!seenW[v.word]) data.vocab.push(v);
    else seenW[v.word].learned = seenW[v.word].learned || v.learned;
  });

  /* defs: merge objects */
  var rd = remote.defs || {};
  for (var w in rd) { if (!data.defs[w]) data.defs[w] = rd[w]; }

  /* players: union */
  (remote.players || []).forEach(function(n){ if (data.players.indexOf(n) < 0) data.players.push(n); });

  /* events: union by ts+type */
  var seenEv = {};
  (data.events || []).forEach(function(e){ seenEv[e.type + ":" + e.ts] = true; });
  (remote.events || []).forEach(function(e){ if (!seenEv[e.type + ":" + e.ts]) { if (!data.events) data.events = []; data.events.push(e); } });
  if (data.events) data.events.sort(function(a,b){ return b.ts - a.ts; });

  /* location: keep whichever exists */
  if (!data.location && remote.location) data.location = remote.location;

  /* queue: keep local (device has fresher due-dates) unless empty */
  if (!data.queue.length && remote.queue) data.queue = remote.queue;

  /* scoring: always default to standard; do not inherit from remote */
}

function fmtAgo(ts){
  if (!ts) return "";
  var s = Math.round((Date.now() - ts) / 1000);
  if (s < 5) return "just now";
  if (s < 60) return s + "s ago";
  return Math.round(s/60) + "m ago";
}

function renderSyncStatus(){
  var el = document.getElementById("syncStatus");
  if (!el) return;
  if (syncState.status === "syncing") { el.textContent = "syncing…"; el.style.color = "var(--sage)"; }
  else if (syncState.status === "ok") { el.textContent = "synced " + fmtAgo(syncState.lastSync); el.style.color = "var(--sage)"; }
  else if (syncState.status === "error") { el.textContent = "sync error · offline?"; el.style.color = "var(--rust)"; }
  else { el.textContent = ""; }
}

function syncDown(cb){
  if (!data.player) { if (cb) cb(); return; }
  syncState.status = "syncing"; renderSyncStatus();
  var getHeaders = {};
  if (data.player && data.player.toLowerCase() === "devon") {
    var tok = getDevonToken();
    if (tok) getHeaders["X-Admin-Token"] = tok;
  }
  fetch(API + "?user=" + encodeURIComponent(data.player), { headers: getHeaders })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(remote){
      if (remote && Object.keys(remote).length) { mergeData(remote); saveLocal(); }
      syncState.status = "ok"; syncState.lastSync = Date.now(); syncState.error = null;
      renderSyncStatus();
      if (cb) cb();
    }).catch(function(e){
      syncState.offline = !navigator.onLine;
      syncState.status = "error"; syncState.error = String(e);
      renderSyncStatus();
      renderUnsyncedPill();
      if (cb) cb();
    });
}

function syncUp(){
  if (!data.player) return;
  setPending(true);
  syncState.status = "syncing"; renderSyncStatus();
  var getHeaders = {};
  if (data.player.toLowerCase() === "devon") {
    var tok = getDevonToken();
    if (tok) getHeaders["X-Admin-Token"] = tok;
  }
  /* fetch server state first so we never overwrite sessions that only exist there */
  fetch(API + "?user=" + encodeURIComponent(data.player), { headers: getHeaders })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(remote){
      if (remote && Object.keys(remote).length) { mergeData(remote); saveLocal(); }
      var payload = Object.assign({}, data, { lastSyncedAt: Date.now() });
      var postHeaders = Object.assign({ "Content-Type": "application/json" }, getHeaders);
      return fetch(API + "?user=" + encodeURIComponent(data.player), {
        method: "POST", headers: postHeaders, body: JSON.stringify(payload)
      });
    })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(res){
      if (res && res.queued) { syncState.status = "error"; syncState.error = "queued"; renderSyncStatus(); return; }
      setPending(false);
      syncState.status = "ok"; syncState.lastSync = Date.now(); syncState.error = null;
      try { localStorage.setItem("boggle:lastServerSync", String(syncState.lastSync)); } catch(e) {}
      renderSyncStatus();
    }).catch(function(e){
      syncState.status = "error"; syncState.error = String(e);
      renderSyncStatus();
    });
}

function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { storageOk = false; }
}

function save(){
  saveLocal();
  /* debounce uploads — wait 1.5s after last save before pushing */
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(syncUp, 1500);
}

var S = {

};

/* ---------------- dom helpers ---------------- */
function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "class") el.className = attrs[k];
    else if (k === "text") el.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) el.appendChild(c); });
  return el;
}

  ]);

/* ---------------- metrics ---------------- */
function allWords(){ return S.paths ? Array.from(S.paths.keys()) : []; }
function all5(){ return allWords().filter(function(w){ return w.length >= 5 && COMMON.has(w); }); }
function found5(){ return S.found.filter(function(w){ return w.length >= 5 && COMMON.has(w); }); }
function pct(){ var a = all5().length; return a ? Math.round(found5().length / a * 100) : 0; }

/* ---------------- round flow ---------------- */
function startRound(existing, code){
  if (existing) {
    S.board = existing;
    S.currentCode = code || generateCode();
  } else {
    var c = S.pendingCode || generateCode();
    S.board = codeToBoard(c);
    S.currentCode = c;
  }
  S.pendingCode = null;
  S.paths = solveBoard(S.board);
  S.found = []; S.tags = {}; S.sel = null; S.flash = null; S.typing = false;
  S.challenge = null; S.confirm = null; S.revealed = {}; hideQbar();
  S.seed = Date.now() % 9973;
  S.left = S.duration;
  S.phase = "running";
  S.paused = false;
  S.tab = "play";
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  render();
}
function tick(){
  S.left--;
  paintClock();
  if (S.left <= 0) endRound();
}
function pauseRound(){
  clearInterval(timer); timer = null;
  S.paused = true;
  if (boardEl) boardEl.classList.add("paused");
  paintClock();
}
function resumeRound(){
  S.paused = false;
  if (boardEl) boardEl.classList.remove("paused");
  timer = setInterval(tick, 1000);
  paintClock();
  renderFooter();
}
function paintClock(){
  var pill = document.getElementById("clockPill");
  if (!pill) return;
  if (S.phase !== "running") { pill.className = ""; pill.textContent = ""; return; }
  if (S.paused) { pill.textContent = "⏸ " + fmt(S.left); pill.className = "on"; return; }
  pill.textContent = fmt(S.left);
  pill.className = "on" + (S.left <= 20 ? " low" : "");
}
function fmt(s){ return Math.floor(s / 60) + ":" + String(Math.max(0, s % 60)).padStart(2, "0"); }
function endRound(early){
  clearInterval(timer); timer = null;
  S.paused = false;
  S.endedEarly = early === true;
  S.leftAtEnd = Math.max(0, S.left);
  S.phase = "review";
  saveSession();
  render();
  showGameOver();
}
function getLocation(cb){
  if (data.location) { cb(data.location, "granted"); return; }
  if (!navigator.geolocation) { cb(null, "unavailable"); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon, {
      headers: { "Accept-Language": "en", "User-Agent": "BoggleTrainer/1.0" }
    }).then(function(r){ return r.json(); }).then(function(d){
      var a = d.address || {};
      cb({ lat: lat, lon: lon, city: a.city || a.town || a.village || a.county || "", country: a.country || "" }, "granted");
    }).catch(function(){ cb({ lat: lat, lon: lon, city: "", country: "" }, "granted"); });
  }, function(e){ cb(null, e.code === 1 ? "denied" : "unavailable"); }, { timeout: 5000 });
}

function setPlayer(name, _skipDevonCheck){
  var n = String(name || "").trim().slice(0, 24) || "Player";
  if (n.toLowerCase() === "devon" && !_skipDevonCheck) {
    if (!getDevonToken()) {
      showDevonPasswordModal(n);
      return;
    }
  }
  var first = !data.player;
  data.player = n;
  if (data.players.indexOf(n) < 0) data.players.push(n);
  /* rounds played before names existed belong to whoever names themselves first */
  if (first) data.sessions.forEach(function(x){ if (!x.player) x.player = n; });
  if (!data.createdAt) data.createdAt = Date.now();
  if (!data.events) data.events = [];
  var alreadyHasSignup = data.events.some(function(e){ return e.type === "signup"; });
  if (!alreadyHasSignup) data.events.push({ type: "signup", ts: data.createdAt, player: n, loc: null, locationPerms: "pending" });
  saveLocal();
  closeModal();
  /* upload immediately before waiting for location */
  clearTimeout(syncDebounce);
  syncUp();
  syncDown(function(){ render(); });
  /* grab location asynchronously and update if granted */
  getLocation(function(loc, perms){
    if (loc && !data.location) data.location = loc;
    /* update the signup event with location result */
    var signup = data.events.filter(function(e){ return e.type === "signup" && e.player === n; })[0];
    if (signup) { signup.loc = loc; signup.locationPerms = perms; }
    save();
  });
}
function showDevonPasswordModal(name){
  var m = document.getElementById("modal");
  if (!m) return;
  m.innerHTML = "";
  var input = h("input", { type: "password", class: "nameinput", placeholder: "password",
    autocomplete: "current-password", autocorrect: "off", spellcheck: "false" });
  var errMsg = h("div", { class: "mnote", style: "color:var(--rust);display:none", text: "Wrong password — try again" });
  function attempt(){
    var pw = input.value.trim();
    if (!pw) return;
    /* verify against server via GET — never POST empty local data as auth check */
    fetch(API + "?user=devon", {
      headers: { "X-Admin-Token": pw }
    }).then(function(r){
      if (r.ok || r.status === 200) {
        setDevonToken(pw);
        setPlayer(name, true);
      } else {
        errMsg.style.display = "";
        input.value = "";
        input.focus();
      }
    }).catch(function(){
      errMsg.style.display = "";
      input.value = "";
      input.focus();
    });
  }
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") attempt(); });
  m.appendChild(h("div", { class: "mcard" }, [
    h("div", { class: "eyebrow", text: "protected account" }),
    h("div", { class: "mtitle", style: "font-size:30px", text: "Password for Devon" }),
    input,
    errMsg,
    h("div", { class: "row", style: "margin-top:16px;justify-content:center" }, [
      h("button", { class: "btn", text: "Sign in", onclick: attempt }),
      h("button", { class: "btn ghost", text: "Cancel", onclick: closeModal })
    ])
  ]));
  openModal(m);
  setTimeout(function(){ input.focus(); }, 60);
}

function paintDef(body, entries, cached, src){
  body.innerHTML = "";
  if (!entries || !entries.length) {
    body.appendChild(h("div", { class: "p", text: "No definition came back for this one." }));
    return;
  }
  entries.forEach(function(m){
    body.appendChild(h("div", { class: "pos", text: m.pos }));
    m.defs.forEach(function(d, i){ body.appendChild(h("div", { class: "dline", text: (i + 1) + ". " + d })); });
  });
  body.appendChild(h("div", { class: "src", text: cached ? "saved on this device" : (src || "dictionaryapi.dev") + " · saved for offline" }));
}
function loadDef(w){
  var body = document.getElementById("defbody");
  data.defs = data.defs || {};
  if (data.defs[w]) return paintDef(body, data.defs[w], true);
  if (navigator.onLine === false) {
    body.innerHTML = "";
    body.appendChild(h("div", { class: "p", text: "You're offline and this word isn't saved yet. Look it up next time you have a connection and it'll stay available." }));
    return;
  }

  function setBody(el){ var b = document.getElementById("defbody"); if (b){ b.innerHTML = ""; b.appendChild(el); } }
  function saveDef(out, src){
    data.defs[w] = out; save();
    var b = document.getElementById("defbody");
    if (b) paintDef(b, out, false, src);
  }

  /* fallback: datamuse */
  function tryDatamuse(){
    fetch("https://api.datamuse.com/words?sp=" + encodeURIComponent(w) + "&md=d&max=1")
      .then(function(r){ return r.ok ? r.json() : Promise.reject("neterr"); })
      .then(function(j){
        var entry = j && j[0] && j[0].word && j[0].word.toLowerCase() === w.toLowerCase() ? j[0] : null;
        var rawDefs = entry && entry.defs;
        if (!rawDefs || !rawDefs.length) {
          setBody(h("div", { class: "p", text: "No definition found for \u201c" + w + "\u201d. (Valid in Boggle but not in either dictionary.)" }));
          return;
        }
        var grouped = {};
        rawDefs.forEach(function(d){
          var parts = d.match(/^(\S+)\s+(.*)/);
          if (!parts) return;
          var pos = parts[1], def = parts[2];
          if (!grouped[pos]) grouped[pos] = [];
          grouped[pos].push(def);
        });
        var out = Object.keys(grouped).slice(0, 3).map(function(pos){
          return { pos: pos, defs: grouped[pos].slice(0, 2) };
        });
        saveDef(out, "datamuse.com");
      })
      .catch(function(){ setBody(h("div", { class: "p", text: "Couldn\u2019t reach the dictionary. Check your connection and try again." })); });
  }

  /* primary: dictionaryapi.dev with up to 2 retries */
  var attempts = 0;
  function tryPrimary(){
    attempts++;
    fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(w))
      .then(function(r){
        if (r.status === 404) throw new Error("notfound");
        if (!r.ok) throw new Error("neterr");
        return r.json();
      })
      .then(function(j){
        var out = (j[0].meanings || []).slice(0, 3).map(function(mn){
          return { pos: mn.partOfSpeech, defs: (mn.definitions || []).slice(0, 2).map(function(d){ return d.definition; }) };
        });
        saveDef(out, "dictionaryapi.dev");
      })
      .catch(function(e){
        if (e && e.message === "notfound") { tryDatamuse(); return; }
        if (attempts < 3) { setTimeout(tryPrimary, 800 * attempts); return; }
        tryDatamuse();
      });
  }
  tryPrimary();
}
function showSyncDiffModal(){

  m.innerHTML = "";
  openModal(m);

  var wrap = h("div", { style: "background:var(--surface);border-radius:18px;padding:24px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;position:relative" });
  wrap.appendChild(h("div", { class: "eyebrow", text: "reviewing sync changes" }));

  m.appendChild(wrap);
  m.onclick = function(e){ if (e.target === m) closeModal(); };

function hideQbar(){
  var bar = document.getElementById("qbar");

function guessChallenge(word, path){
  if (S.confirm) {
    if (word === S.confirm) {
      var w = S.confirm;
      S.confirm = null;
      hideQbar();
      paint(path, "ok");
      setTimeout(function(){ paint(S.paths.get(w), "trace"); }, 700);
    } else {
      paint(path, "bad");
      if (S.paths.has(word) && word.length >= 3) flashQ("that's " + word + " — try again");
      else flashQ("not quite — try again");
      setTimeout(function(){ if (!dragPath && S.confirm) paint(S.paths.get(S.confirm), "trace"); }, 700);
    }
    return;
  }
  if (!S.challenge) { paint(null); return; }
  if (word === S.challenge) { revealChallenge(word, "got", path); return; }
  paint(path, "bad");
  if (S.paths.has(word) && word.length >= 3) flashQ("that's " + word + " — not this one");
  else flashQ("not it — try again");
  setTimeout(function(){ if (!dragPath && S.challenge) paint(tilesOf(S.challenge), "letters"); }, 700);
}

  var bar = document.getElementById("qbar");

  q.appendChild(h("b", { text: msg }));
  setTimeout(function(){ if (bar.className) q.innerHTML = keep; }, 1200);
}

  var left = h("div", { class: "reviewLeft" });
  layout.appendChild(left);
  layout.appendChild(h("div", { class: "reviewLeft-spacer" }));
  var wrap = h("div", { class: "reviewRight stack" });
  layout.appendChild(wrap);

  left.appendChild(buildTray({ interactive: S.quiz }));
  var newBoardRow = h("div", { style: "display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap" }, [
    h("button", { class: "linkbtn", style: "font-size:12px;color:var(--ink);background:var(--amber);border-radius:999px;padding:4px 16px", text: "New board", onclick: function(){ S.phase = "idle"; S.sel = null; S.challenge = null; hideQbar(); render(); } })
  ]);
  if (S.currentCode) {
    var revCodeEl = h("span", { style: "font-family:var(--mono);font-size:11px;color:var(--sage);letter-spacing:.04em", text: S.currentCode });
    var revCopyBtn = h("button", { class: "linkbtn", style: "padding:2px 8px;font-size:10px", text: "Copy" });
    revCopyBtn.addEventListener("click", function(){
      navigator.clipboard && navigator.clipboard.writeText(S.currentCode).then(function(){
        revCopyBtn.textContent = "Copied!";
        setTimeout(function(){ revCopyBtn.textContent = "Copy"; }, 1800);
      });
    });
    newBoardRow.appendChild(revCodeEl);
    newBoardRow.appendChild(revCopyBtn);
  }
  left.appendChild(newBoardRow);
  var longest = S.found.slice().sort(function(a, b){ return b.length - a.length; })[0];
  wrap.appendChild(h("div", { style: "display:flex;justify-content:center" }, [
    h("div", { class: "grid3", style: "display:inline-grid;grid-template-columns:repeat(3,1fr)" }, [
      (function(){ var total = sumScore(Array.from(S.paths.keys())); var got = sumScore(S.found); return stat("score", Math.round(got / total * 100) + "%", got + " / " + total + " pts"); })(),
      stat("5L+", pct() + "%", found5().length + " of " + all5().length),
      stat("longest", (longest ? longest.length : 0) + "L", longest || "—")
    ])
  ]));

  var head = h("div", { class: "between" }, [
    h("div", { class: "eyebrow", text: "missed" }),
    h("div", { class: "row" }, [
      h("button", { class: "mono", style: "font-size:11px;color:" + (S.quiz ? "var(--amber)" : "var(--sage)"),
        text: "quiz", onclick: function(){ S.quiz = !S.quiz; S.challenge = null; hideQbar(); render(); } }),
      h("button", { class: "mono", style: "font-size:11px;color:" + (S.showShort ? "var(--amber)" : "var(--sage)"),
        text: "3–4L", onclick: function(){ S.showShort = !S.showShort; render(); } }),
      h("button", { class: "mono", style: "font-size:11px;color:" + (S.showRare ? "var(--amber)" : "var(--sage)"),
        text: "rare", onclick: function(){ S.showRare = !S.showRare; render(); } })
    ])
  ]);
  wrap.appendChild(head);

  var missed = allWords().filter(function(w){
    return S.found.indexOf(w) < 0 && (S.showRare || COMMON.has(w)) && (S.showShort || w.length >= 5);
  }).sort(function(a, b){ return a.length - b.length || (a < b ? -1 : 1); }).slice(0, 150);

  var list = h("div", {});
  missed.forEach(function(w){
    var hidden = S.quiz && !S.revealed[w];
    var mark = S.revealed[w] === "got" ? " got" : S.revealed[w] === "shown" ? " shown" : "";
    var text = hidden
      ? Array(w.length + 1).join("•") + " · " + w.length + "L · " + scoreOf(w) + "p"
      : w + " · " + w.length + "L · " + scoreOf(w) + "p";
    var row = h("div", { class: "missrow" + (S.sel === w ? " sel" : "") }, [
      h("button", { class: "w mono" + (hidden ? " masked" : mark),
        text: text,
        onclick: function(){
          if (hidden) { startChallenge(w); highlight(row); }
          else { S.sel = w; hideQbar(); S.challenge = null; paint(S.paths.get(w), "trace"); highlight(row); }
        } }),
      tagPair(w, hidden)
    ]);
    list.appendChild(row);
  });
  if (!missed.length) list.appendChild(h("div", { class: "p", text: "Nothing missed at this length. Rare." }));
  list.style.marginBottom = "24px";
  wrap.appendChild(list);
  return layout;
}
/* the two tags are mutually exclusive; tapping the one that's already set
   is a no-op, except "unfamiliar", which re-opens the definition */
function tagPair(w, hidden){
  var box = h("div", { class: "row", style: "gap:6px" });
  var unf = h("button", { class: "tag", text: "unfamiliar" });
  var paint = function(){
    unf.className = "tag" + (S.tags[w] === "new" ? " new" : "");
  };
  unf.addEventListener("click", function(){
    var already = S.tags[w] === "new";
    if (already) {
      tagMiss(w, "knew"); /* untoggle — removes from vocab */
      paint();
    } else {
      tagMiss(w, "new"); paint();
      if (hidden && !S.revealed[w]) {
        S.revealed[w] = "shown";
        if (S.challenge === w) { S.challenge = null; hideQbar(); }
        S.sel = w;
        render();
      }
      showDefModal(w);
    }
  });
  paint();
  box.appendChild(unf);
  return box;
}
function highlight(row){
  Array.prototype.forEach.call(document.querySelectorAll(".missrow"), function(r){ r.className = "missrow"; });
  row.className = "missrow sel";
}
function tagMiss(w, kind){
  S.tags[w] = kind;
  if (kind === "new") {
    if (!data.vocab.some(function(v){ return v.word === w; })) {
      data.vocab.unshift({ word: w, ts: Date.now(), learned: false });
      data.vocab = data.vocab.slice(0, 500);
      save();
    }
  } else {
    var before = data.vocab.length;
    data.vocab = data.vocab.filter(function(v){ return v.word !== w; });
    if (data.vocab.length !== before) save();
  }
}

function svgEl(tag, attrs){
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function median(arr){ if (!arr.length) return 0; var a = arr.slice().sort(function(x, y){ return x - y; }); return Math.round(a[Math.floor(a.length / 2)]); }
function relDate(ts){
  var mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 60) return mins + " min" + (mins === 1 ? "" : "s") + " ago";
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + " hour" + (hours === 1 ? "" : "s") + " ago";
  var days = Math.floor(hours / 24);
  return days + " day" + (days === 1 ? "" : "s") + " ago";
}

var LEN_COLOR = { 60: "#7FB8A6", 120: "#C8593F", 180: "#E9A83A" };
function lenOf(x){ return x.seconds || 180; }
function lenName(d){ return (d / 60) + " min"; }
var SCORING_MODES = [
  { key: "standard", label: "Standard Scoring", zero3: false, zero4: false },
  { key: "4plus",    label: "4L+ only",          zero3: true,  zero4: false },
  { key: "5plus",    label: "5L+ only",           zero3: true,  zero4: true  }
];
function modeKeyOf(x){
  var m = sessionMode(x);
  if (m.zero3 && m.zero4) return "5plus";
  if (m.zero3) return "4plus";
  return "standard";
}
function modeLabelOf(x){ return (SCORING_MODES.filter(function(m){ return m.key === modeKeyOf(x); })[0] || {}).label || ""; }

/* one x-slot per round in overall chronological order, so the three
   round-length series stay in real sequence instead of being stretched
   to a common length */
function showSvgTip(t, text, x, y, W){
  var tip = t.tip, tipBg = t.tipBg, vline = t.vline;
  tip.textContent = text;
  tip.setAttribute("x", x);
  tip.setAttribute("y", y - 8);
  tip.setAttribute("visibility", "visible");
  try {
    var bb = tip.getBBox();
    var pad = 3;
    tipBg.setAttribute("x", bb.x - pad);
    tipBg.setAttribute("y", bb.y - pad);
    tipBg.setAttribute("width", bb.width + pad * 2);
    tipBg.setAttribute("height", bb.height + pad * 2);
    tipBg.setAttribute("visibility", "visible");
  } catch(e) {}
  if (vline) { vline.setAttribute("x1", x); vline.setAttribute("x2", x); vline.setAttribute("visibility", "visible"); }
}
function hideSvgTip(t){
  t.tip.setAttribute("visibility", "hidden");
  t.tipBg.setAttribute("visibility", "hidden");
  if (t.vline) t.vline.setAttribute("visibility", "hidden");
}
function makeSvgTip(svg, H){
  var vline = svgEl("line", { x1: 0, y1: 0, x2: 0, y2: H, stroke: "#141F1A", "stroke-width": 1, opacity: 0.6, visibility: "hidden" });
  var tipBg = svgEl("rect", { x: 0, y: 0, rx: 3, fill: "#141F1A", "fill-opacity": 0.85, visibility: "hidden" });
  var tip = svgEl("text", { x: 0, y: 0, fill: "#E9CFA0", "font-size": 9, "font-family": "ui-monospace, Menlo, monospace", "text-anchor": "middle", visibility: "hidden" });
  /* appended lazily so they land after all lines/dots in DOM order (= on top) */
  return {
    tip: tip, tipBg: tipBg, vline: vline,
    attach: function(){ svg.appendChild(vline); svg.appendChild(tipBg); svg.appendChild(tip); }
  };
}
function addDotTooltips(svg, pts, W, H, valFn, t){
  pts.forEach(function(p){
    var hit = svgEl("circle", { cx: p.x, cy: p.y, r: 16, fill: "transparent", style: "cursor:pointer" });
    function show(e){ e.stopPropagation(); showSvgTip(t, relDate(p.s.ts) + " · " + valFn(p.s), p.x, p.y, W); }
    hit.addEventListener("click", function(e){ e.stopPropagation(); if (p.s.board) { showSessionModal(p.s); } else { show(e); } });
    hit.addEventListener("mouseenter", show);
    hit.addEventListener("mouseleave", function(){ hideSvgTip(t); });
    svg.appendChild(hit);
  });
}
function addMaTooltip(svg, maEl, W, t){
  function showMa(e){
    var svg = maEl.ownerSVGElement;
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    var local = pt.matrixTransform(svg.getScreenCTM().inverse());
    showSvgTip(t, "5-round moving avg", local.x, local.y, W);
    if (t.vline) t.vline.setAttribute("visibility", "hidden");
  }
  maEl.addEventListener("mouseenter", showMa);
  maEl.addEventListener("mouseleave", function(){ hideSvgTip(t); });
  maEl.addEventListener("click", function(e){ e.stopPropagation(); showMa(e); });
  var pts = maEl.getAttribute("points");
  var hitEl = svgEl("polyline", { points: pts, fill: "none", stroke: "transparent", "stroke-width": 20, style: "cursor:pointer" });
  hitEl.addEventListener("mouseenter", showMa);
  hitEl.addEventListener("mouseleave", function(){ hideSvgTip(t); });
  hitEl.addEventListener("click", function(e){ e.stopPropagation(); showMa(e); });
  maEl.parentNode.insertBefore(hitEl, maEl.nextSibling);
}

function trendChart(sessions, actives, allSessions, show){
  var W = 320, H = 175, PADL = 26, PADB = 14, top = 8;
  var bottom = H - PADB, span = bottom - top;
  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", style: "width:100%;height:200px;overflow:visible" });
  var t = makeSvgTip(svg, H);
  var vis = sessions.filter(function(x){ return actives.indexOf(lenOf(x)) >= 0; });
  var maxY = 100;
  [0, maxY / 2, maxY].forEach(function(v){
    var y = bottom - (v / maxY) * span;
    svg.appendChild(svgEl("line", { x1: PADL, y1: y, x2: W, y2: y, stroke: "#31463B", "stroke-width": 1 }));
    var lab = svgEl("text", { x: 0, y: y + 3, fill: "#8CA598", "font-size": 9, "font-family": "ui-monospace, Menlo, monospace" });
    lab.textContent = Math.round(v) + "%";
    svg.appendChild(lab);
  });
  var xAt = function(i){
    return PADL + (sessions.length > 1 ? i / (sessions.length - 1) : 0.5) * (W - PADL - 6);
  };
  var yAt = function(v){ return bottom - (v / maxY) * span; };
  var allPts = [];
  actives.forEach(function(d){
    var pts = [];
    sessions.forEach(function(x, i){ if (lenOf(x) === d) pts.push({ x: xAt(i), y: yAt(x.pct), s: x }); });
    if (!pts.length) return;
    var actualOp = (!show || show.actual) ? 1 : 0;
    var avgOp = (!show || show.avg) ? 0.7 : 0;
    var actualG = svgEl("g", { class: "actual-lines", style: "opacity:" + actualOp + ";transition:opacity .3s" });
    var avgG = svgEl("g", { class: "avg-lines", style: "opacity:" + avgOp + ";transition:opacity .3s" });
    if (pts.length > 1) actualG.appendChild(svgEl("polyline", {
      points: pts.map(function(p){ return p.x + "," + p.y; }).join(" "),
      fill: "none", stroke: LEN_COLOR[d], "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
    pts.forEach(function(p){
      actualG.appendChild(svgEl("circle", { cx: p.x, cy: p.y, r: p.s.replay ? 3.5 : 2.6,
        fill: p.s.replay ? "#141F1A" : LEN_COLOR[d], stroke: LEN_COLOR[d], "stroke-width": p.s.replay ? 2 : 0 }));
    });
    if (pts.length >= 2) {
      var maPts = pts.map(function(p, j){
        var win = pts.slice(Math.max(0, j - 4), j + 1);
        var avg = win.reduce(function(a, q){ return a + q.s.pct; }, 0) / win.length;
        return p.x + "," + yAt(avg);
      });
      var maEl = svgEl("polyline", { points: maPts.join(" "), fill: "none", stroke: LEN_COLOR[d], "stroke-width": 2, "stroke-dasharray": "5 3", "stroke-linejoin": "round", "stroke-linecap": "round" });
      avgG.appendChild(maEl);
      addMaTooltip(svg, maEl, W, t);
    }
    svg.appendChild(actualG);
    svg.appendChild(avgG);
    allPts = allPts.concat(pts);
  });
  addDotTooltips(svg, allPts, W, H, function(x){ return x.pct + "%"; }, t);
  t.attach();
  return svg;
}

function pct6Of(x){
  if (!x.board) return null;
  var all6 = Array.from(solveBoard(x.board).keys()).filter(function(w){ return w.length >= 6; });
  if (!all6.length) return null;
  var found6 = (x.found || []).filter(function(w){ return w.length >= 6; }).length;
  return Math.round(found6 / all6.length * 100);
}

function heatmap(){
  var counts = {};
  data.sessions.forEach(function(x){ var k = dayKey(x.ts); counts[k] = (counts[k] || 0) + 1; });
  var box = h("div", { class: "heat" });
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var start = new Date(today.getTime() - 69 * DAY);
  start = new Date(start.getTime() - start.getDay() * DAY);
  for (var t = start.getTime(); t <= today.getTime(); t += DAY) {
    var n = counts[dayKey(t)] || 0;
    var cell = h("i", { title: new Date(t).toLocaleDateString() + ": " + n });
    if (n) cell.style.background = n >= 3 ? "#E9A83A" : n === 2 ? "rgba(233,168,58,.65)" : "rgba(233,168,58,.32)";
    box.appendChild(cell);
  }
  var legend = h("div", { class: "legend" }, [h("span", { text: "less" })]);
  ["#22332B", "rgba(233,168,58,.32)", "rgba(233,168,58,.65)", "#E9A83A"].forEach(function(c){
    var i = h("i"); i.style.background = c; legend.appendChild(i);
  });
  legend.appendChild(h("span", { text: "more" }));
  return h("div", {}, [box, legend]);
}

function streak(){
  var days = {};
  data.sessions.forEach(function(x){ days[dayKey(x.ts)] = 1; });
  var n = 0, t = Date.now();
  if (!days[dayKey(t)]) t -= DAY;
  while (days[dayKey(t)]) { n++; t -= DAY; }
  return n;
}

function exportData(){

      vocabBtnEls.forEach(function(b){ b.className = ""; });
      vbtn.className = "on";
      segSlider.style.left = vbtn.offsetLeft + "px";
      segSlider.style.width = vbtn.offsetWidth + "px";
      showLearned = pair[1];
      setTimeout(render, 220);
    });
    segCtrl.appendChild(vbtn);
    vocabBtnEls.push(vbtn);
  });
  requestAnimationFrame(function(){
    var idx = showLearned ? 1 : 0;
    if (vocabBtnEls[idx]) {
      segSlider.style.transition = "none";
      segSlider.style.left = vocabBtnEls[idx].offsetLeft + "px";
      segSlider.style.width = vocabBtnEls[idx].offsetWidth + "px";
      requestAnimationFrame(function(){ segSlider.style.transition = ""; });
    }
  });
  var allVocabList = data.vocab.filter(function(v){ return showLearned ? v.learned : !v.learned; });
  var vocabLimit = 10;
  var vocabList = S.vocabShowAll ? allVocabList : allVocabList.slice(0, vocabLimit);
  var vocabHidden = allVocabList.length - vocabList.length;
  var vocabBox = h("div", {});
  if (!vocabList.length) {
    vocabBox.appendChild(h("div", { class: "p", text: showLearned ? "Nothing learned yet." : "No unfamiliar words tagged yet." }));
  } else {
    var vtbl = document.createElement("table");
    vtbl.className = "recent-table mono";
    var vtbody = document.createElement("tbody");
    vocabList.forEach(function(v){
      var tr = document.createElement("tr");
      function vtd(content, align){
        var td = document.createElement("td");
        td.style.textAlign = align || "left";
        if (typeof content === "string") td.textContent = content;
        else td.appendChild(content);
        return td;
      }
      var btn = h("button", { class: "tag", text: v.learned ? "needs more practice" : "mark as learned",
        onclick: function(){ v.learned = !v.learned; save(); render(); } });
      tr.appendChild(vtd(v.word));
      tr.appendChild(vtd(v.word.length >= 5 ? "5+ letters" : v.word.length + " letters", "center"));
      tr.appendChild(vtd(btn, "right"));
      vtbody.appendChild(tr);
    });
    vtbl.appendChild(vtbody);
    var vtblCard = h("div", { class: "card", style: "padding:12px 0;border-radius:12px 0 12px 12px" });
    vtbl.style.cssText = "margin:-12px 0";
    vtblCard.appendChild(vtbl);
    vocabBox.appendChild(vtblCard);
  }
  var vocabSection = h("div", { class: "section" }, [
    h("div", { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:0" }, [
      h("div", { class: "eyebrow", text: "unfamiliar words" }),
      segCtrl
    ]),
    vocabBox
  ]);
  if (vocabHidden > 0) {
    vocabSection.appendChild(h("button", {
      class: "linkbtn",
      style: "margin-top:8px;display:block;margin-left:auto",
      text: "Show " + vocabHidden + " more…",
      onclick: function(){ S.vocabShowAll = true; render(); }
    }));
  }
  wrap.appendChild(h("div", { style: "height:5px" }));
  wrap.appendChild(vocabSection);

  return wrap;
}

var showLearned = false;

/* ---------------- toast ---------------- */
function showToast(msg) {
  var existing = document.getElementById("toast");
  if (existing) existing.remove();
  var t = document.createElement("div");
  t.id = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add("show"); });
  setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){ t.remove(); }, 300); }, 2500);
}

/* ---------------- shell ---------------- */
function render(){
  app.innerHTML = "";
  var header = h("div", { class: "hdr between" }, [
    h("div", { class: "row", style: "gap:10px;align-items:baseline" }, [
      h("button", { class: "h1", style: "font-size:16px;letter-spacing:.01em;background:none;border:none;color:inherit;cursor:pointer;padding:0;font-family:inherit", text: "Boggle Trainer", onclick: function(){ S.tab = "play"; render(); } }),
      h("button", { class: "playerbtn", onclick: function(){ showNameModal(false); } }, [
        h("span", { text: "player: " }),
        h("b", { text: data.player || "—" }),
        h("span", { text: " ▾" })
      ])
    ]),
    S.phase === "review" ? h("div", { class: "mono sage", style: "font-size:12px", text: "round over" }) : null
  ]);
  app.appendChild(header);
  app.appendChild(h("div", { class: "hdr-spacer" }));

  if (S.tab === "play") app.appendChild(S.phase === "idle" ? screenIdle() : S.phase === "running" ? screenRunning() : screenReview());
  else if (S.tab === "progress") app.appendChild(screenProgress());
  else if (S.tab === "settings") app.appendChild(screenSettings());

  if (!storageOk) app.appendChild(h("div", { class: "mono", style: "color:var(--rust);font-size:11px;margin-top:20px",
    text: "Storage is unavailable here — progress won't be saved between sessions." }));

  app.className = S.tab === "play" ? "wide" : "";
  paintClock();

  navEl.innerHTML = "";
  [["play", "Play"], ["progress", "Progress"], ["settings", "Settings"]].forEach(function(t){
    navEl.appendChild(h("button", { class: S.tab === t[0] ? "on" : "", text: t[1],
      onclick: (function(tab){ return function(){
        S.tab = tab; S.challenge = null; hideQbar();
        history.replaceState(null, "", tab === "play" ? location.pathname : "#" + tab);
        render();
      }; })(t[0]) }));
  });
}
if (location.hash === "#progress" || location.hash === "#settings" || location.hash === "#how-to-install") {
  S.tab = location.hash === "#progress" ? "progress" : "settings";
} else if (location.hash === "#play") {
  S.tab = "play";
}
render();
if (!data.player && location.hash !== "#how-to-install") showNameModal(true);
if (location.hash === "#how-to-install") {
  setTimeout(function(){
    var el = document.getElementById("install-block");
    if (el) el.classList.add("highlight-pop");
  }, 100);
}

/* pull latest from server on startup */
syncDown(function(){ render(); });

/* ---------------- settings screen ---------------- */
var dbgLog = function(){}; /* no-op until settings screen is mounted */
function backupBlock(){
  var file = h("input", { type: "file", accept: "application/json", style: "display:none" });
  file.addEventListener("change", function(){ if (file.files[0]) importData(file.files[0]); });

  var unsynced = unsyncedSessions();
  var pendingBlock = null;
  if (syncState.pending || unsynced.length) {
    var pendingRows = h("div", { style: "margin-top:6px" });
    if (unsynced.length) {
      unsynced.forEach(function(s){
        pendingRows.appendChild(h("div", { class: "missrow mono", style: "font-size:11px;opacity:.8" }, [
          h("span", { class: "sage", text: new Date(s.ts).toLocaleString() + " · " + ((s.seconds||180)/60) + "m" }),
          h("span", { text: s.found5 + "/" + s.total5 + " at 5+ · " + s.score + " pts" })
        ]));
      });
    }
    var pushBtn = h("button", { class: "linkbtn", style: "margin-top:8px", text: "Push to server now" });
    pushBtn.onclick = function(){
      pushBtn.disabled = true; pushBtn.textContent = "Pushing…";
      clearTimeout(syncDebounce);
      var was = syncState.lastSync;
      syncUp();
      var attempts = 0;
      var poll = setInterval(function(){
        attempts++;
        if (syncState.lastSync !== was) {
          clearInterval(poll);
          notify("Synced! " + unsynced.length + " session" + (unsynced.length === 1 ? "" : "s") + " uploaded.", false);
          render();
        } else if (syncState.status === "error" && syncState.error !== "queued") {
          clearInterval(poll);
          notify(syncState.offline ? "Offline — saved locally, will sync when reconnected." : "Sync failed: " + syncState.error, true);
          pushBtn.disabled = false; pushBtn.textContent = "Push to server now";
        } else if (attempts > 10) {
          clearInterval(poll);
          notify(syncState.pending ? "Queued for retry when online." : "Done.", !syncState.pending);
          render();
        }
      }, 400);
    };
    pendingBlock = h("div", { style: "margin-top:10px;padding:10px;background:var(--surface2);border-radius:10px;border:1px solid var(--amber)" }, [
      h("div", { class: "eyebrow", style: "color:var(--amber)", text: unsynced.length + " local session" + (unsynced.length === 1 ? "" : "s") + " not yet on server" }),
      pendingRows,
      pushBtn
    ]);
  }

  var syncRow = h("div", { class: "row", style: "margin-top:10px;gap:10px;flex-wrap:wrap" }, [
    h("span", { class: "mono", id: "syncStatus", style: "font-size:11px" })
  ]);
  setTimeout(renderSyncStatus, 50);
  return h("div", { class: "section" }, [
    h("div", { class: "eyebrow", text: "backup & sync" }),
    h("div", { class: "row", style: "margin-top:8px" }, [
      h("button", { class: "linkbtn", text: "Export JSON", onclick: exportData }),
      h("button", { class: "linkbtn", text: "Import JSON", onclick: function(){ file.click(); } }),
      file
    ]),
    pendingBlock,
    syncRow,
    h("div", { class: "mono sage", style: "font-size:10px;margin-top:6px",
      text: "history synced to cloud by username · also cached locally" })
  ]);
}

      '<polyline points="280,41 285,45 280,49" fill="none" stroke="#8CA598" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
      /* step 3: home screen icon */

  })() : null;

  var installBlock = h("div", { id: "install-block", style: "padding:12px;background:var(--surface2);border-radius:10px;margin:16px 0" }, [
    h("div", { class: "eyebrow", text: "install as app" }),
    h("div", { style: "font-size:13px;color:var(--bone);margin-top:6px;line-height:1.5" },
      [document.createTextNode("Add Boggle Trainer to your iPhone home screen & play offline!")]),
    installDiagram || null,
    h("a", { href: "https://youtu.be/lKbsY8hLVaw?si=fh9EAUYUbaGObQgP&t=35", target: "_blank", rel: "noopener",
      style: "display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;color:var(--bone);font-size:13px;text-decoration:none" }, [
      h("span", { style: "display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--amber);flex-shrink:0" }, [
        h("span", { style: "display:inline-block;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid var(--ground);margin-left:2px" })
      ]),
      h("span", { style: "color:var(--amber);font-weight:bold", text: "Watch how to install" })
    ])
  ]);
  wrap.appendChild(installBlock);

  /* players on this device */
  var playerOf = function(x){ return x.player || "Player"; };
  var settingsRoster = [];
  data.sessions.forEach(function(x){ var n = playerOf(x); if (settingsRoster.indexOf(n) < 0) settingsRoster.push(n); });
  if (settingsRoster.length > 1) {
    var board = h("div", {});
    settingsRoster.map(function(n){
      var mine = data.sessions.filter(function(x){ return playerOf(x) === n && (data.includeEarly || !x.early); });
      return { n: n, rounds: mine.length, best: mine.length ? Math.max.apply(null, mine.map(function(x){ return x.score; })) : 0,
        rate: median(mine.map(function(x){ return x.pct; })) };
    }).sort(function(a, b){ return b.best - a.best; }).forEach(function(r, i){
      board.appendChild(h("div", { class: "missrow" }, [
        h("span", { class: "w mono", text: (i + 1) + ". " + r.n }),
        h("span", { class: "mono sage", style: "font-size:12px",
          text: r.rounds + (r.rounds === 1 ? " round · " : " rounds · ") + r.rate + "% at 5+ · best " + r.best })
      ]));
    });
    wrap.appendChild(h("div", { class: "section" }, [h("div", { class: "eyebrow", text: "players on this device" }), board]));
  }

  /* build info */
  var buildDate = new Date(BUILD);
  var buildFmt = buildDate.toLocaleString(undefined, { month:"short", day:"numeric", year:"numeric", hour:"2-digit", minute:"2-digit", timeZoneName:"short" });
  var diffMs = Date.now() - buildDate.getTime();
  var diffMins = Math.floor(diffMs / 60000);
  var ago = diffMins < 60 ? diffMins + "m ago"
    : diffMins < 1440 ? Math.floor(diffMins / 60) + "h ago"
    : Math.floor(diffMins / 1440) + "d ago";
  /* log output */
  var logEl = h("div", { style: "font-family:var(--mono);font-size:11px;color:var(--sage);min-height:32px" });
  dbgLog = function(msg, color){

    line.style.color = color || "var(--sage)";
    logEl.insertBefore(line, logEl.firstChild);
    while (logEl.children.length > 10) logEl.removeChild(logEl.lastChild);
  };

  function dbgBtn(label, color, fn){
    var b = h("button", { class: "linkbtn", text: label });
    b.style.cssText = "border-color:" + color + ";color:" + color;

  /* advanced (collapsed by default) */
  var advancedBody = h("div", { style: "display:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px" }, [
    h("div", { class: "eyebrow", text: "sync" }),
    (function(){
      var rows = [
        { btn: dbgBtn("Sync now", "var(--amber)", function(){
            showSyncDiffModal();
          }),
          what: "Shows a diff of local vs. server, then merges both directions on confirm.",

        { btn: dbgBtn("Force sync UP", "var(--sage)", function(){
            dbgLog("forcing syncUp for: " + (data.player||"(none)"), "var(--sage)");
            clearTimeout(syncDebounce); syncUp();
          }),
          what: "Merges server → local, then pushes combined result to server. No preview.",
          when: "You want to force a sync immediately without the confirmation step."
        },
        { btn: dbgBtn("Force sync DOWN", "var(--sage)", function(){
            dbgLog("syncing down for: " + (data.player||"(none)"), "var(--sage)");
            syncDown(function(){ dbgLog("done — sessions: " + data.sessions.length); render(); });
          }),
          what: "Pulls server state and merges into local. Does not push.",
          when: "You want to pull without triggering an upload."
        },
        { btn: dbgBtn("Check KV", "var(--sage)", function(){
            if (!data.player) { dbgLog("no player set", "var(--rust)"); return; }
            dbgLog("fetching KV for: " + data.player);
            fetch(API + "?user=" + encodeURIComponent(data.player))
              .then(function(r){ return r.json(); })
              .then(function(d){ dbgLog("KV sessions: " + (d.sessions||[]).length + " · players: " + (d.players||[]).join(",")); })
              .catch(function(e){ dbgLog("fetch error: " + e, "var(--rust)"); });
          }),
          what: "Read-only peek at what's stored on the server right now.",
          when: "Verifying the server has the right data without changing anything."
        },
        { btn: dbgBtn("Local state", "var(--sage)", function(){
            dbgLog("player: " + data.player + " · sessions: " + data.sessions.length + " · vocab: " + data.vocab.length + " · queue: " + data.queue.length);
          }),
          what: "Logs in-memory local state (no network). Read-only.",
          when: "Checking what this device has before deciding whether to sync."
        }
      ];
      var tbl = document.createElement("table");
      tbl.style.cssText = "width:100%;border-collapse:collapse;margin-top:8px;margin-bottom:12px;font-family:var(--mono);font-size:11px";
      rows.forEach(function(r){
        var tr = document.createElement("tr");
        tr.style.borderBottom = "1px solid var(--line)";
        var tdBtn = document.createElement("td");
        tdBtn.style.cssText = "padding:8px 12px 8px 0;white-space:nowrap;vertical-align:top";
        tdBtn.appendChild(r.btn);
        var tdDesc = document.createElement("td");
        tdDesc.style.cssText = "padding:8px 0;vertical-align:top;line-height:1.5";
        tdDesc.innerHTML = '<span style="color:var(--bone)">' + r.what + '</span>'
          + '<br><span style="color:var(--sage)">Use when: ' + r.when + '</span>';
        tr.appendChild(tdBtn);
        tr.appendChild(tdDesc);
        tbl.appendChild(tr);
      });
      return tbl;
    })(),

    h("div", { class: "eyebrow", text: "danger zone" }),
    h("div", { class: "row", style: "margin-top:8px;flex-wrap:wrap;gap:8px;margin-bottom:12px" }, [
      dbgBtn("Clear localStorage", "var(--rust)", function(){
        if (!confirm("Clear local storage? Data on server is safe.")) return;
        try { localStorage.removeItem(KEY); } catch(e){}
        dbgLog("localStorage cleared — reload to start fresh", "var(--rust)");
      }),
      dbgBtn("Hard refresh", "var(--rust)", function(){
        dbgLog("unregistering SW + clearing caches…", "var(--rust)");
        var done = function(){ window.location.reload(true); };
        var p = [];
        if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function(regs){ return Promise.all(regs.map(function(r){ return r.unregister(); })); }));
        if (window.caches) p.push(caches.keys().then(function(keys){ return Promise.all(keys.map(function(k){ return caches.delete(k); })); }));
        Promise.all(p).then(done).catch(done);
      })
    ]),

    backupBlock(),
    logEl
  ]);

  var advancedToggle = h("button", { class: "eyebrow", style: "background:none;border:none;cursor:pointer;color:var(--sage);padding:0;display:flex;align-items:center;gap:6px" });
  var chevron = h("span", { text: "▶" });
  advancedToggle.appendChild(chevron);
  advancedToggle.appendChild(h("span", { text: "advanced" }));
  advancedToggle.onclick = function(){
    var open = advancedBody.style.display !== "none";
    advancedBody.style.display = open ? "none" : "block";
    chevron.textContent = open ? "▶" : "▼";
  };

  var refreshBtn = dbgBtn("Refresh app", "var(--sage)", function(){ window.location.reload(); });
  var refreshSpan = h("span", { class: "mono sage", style: "font-size:11px;white-space:nowrap", text: "Built " + buildFmt });
  var agoBadge = h("span", { class: "filter-badge", style: "opacity:.55;font-size:9px;white-space:nowrap", text: ago });
  refreshBtn.style.whiteSpace = "nowrap";
  wrap.appendChild(h("div", { style: "display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px" }, [
    refreshSpan, agoBadge, refreshBtn
  ]));
  wrap.appendChild(h("div", {}, [ advancedToggle, advancedBody ]));
  return wrap;
}

renderUnsyncedPill();

/* offline caching + background sync when served over http(s) */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js?v=" + BUILD).then(function(reg){
    /* register background sync tag so Android Chrome retries when back online */
    if (syncState.pending && reg.sync) reg.sync.register("boggle-sync").catch(function(){});
    /* when a new SW is waiting, tell it to skip waiting and take over immediately */
    reg.addEventListener("updatefound", function(){
      var sw = reg.installing;
      if (!sw) return;
      sw.addEventListener("statechange", function(){
        if (sw.state === "installed" && navigator.serviceWorker.controller) {
          sw.postMessage({ type: "SKIP_WAITING" });
        }
      });
    });
  }).catch(function(){});
  /* reload the page when SW controller changes (new SW took over) */
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    window.location.reload();
  });
}
