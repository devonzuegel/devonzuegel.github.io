<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="34.56" fill="#141F1A"/>
  <!-- bottom edge (boneEdge colour, offset 2px down) -->
  <rect x="28" y="30" width="136" height="136" rx="20" fill="#CFC5AE" filter="url(#shadow)"/>
  <!-- tile face -->
  <rect x="28" y="28" width="136" height="136" rx="20" fill="#F2EDDF"/>
  <text x="96" y="96" text-anchor="middle" dominant-baseline="central" font-family="Futura, 'Avenir Next Condensed', 'Century Gothic', system-ui, sans-serif" font-weight="700" font-size="96" fill="#17201B">B</text>
</svg>
