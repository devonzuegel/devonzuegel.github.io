name: Refresh concert catalog
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: concerts-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: concerts/package-lock.json
      - run: npm ci
        working-directory: concerts
      - run: npm test
        working-directory: concerts
      - run: npm run refresh
        working-directory: concerts
      - name: Save refreshed public listings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add concerts/data/events.json concerts/data/coverage.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh concert venue calendars'
          git push
