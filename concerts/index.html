<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f7f5ef"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191e1b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Find concerts, preview recordings, and save events."
    />
    <title>Concert Tracker</title>
    <link rel="icon" href="./favicon.svg?v=record-e" type="image/svg+xml" />
    <script>
      // Localhost and private-network previews get a distinct violet tab icon.
      const localPreview =
        /^(localhost|.*\.localhost|127(?:\.\d{1,3}){3}|\[::1\]|10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})$/.test(
          location.hostname,
        );
      if (localPreview) {
        document.querySelector('link[rel="icon"]').href =
          "data:image/svg+xml," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#7c3aed"/><circle cx="32" cy="32" r="23" fill="none" stroke="#fff9eb" stroke-opacity=".55" stroke-width="1.8"/><circle cx="32" cy="32" r="18" fill="none" stroke="#fff9eb" stroke-opacity=".55" stroke-width="1.8"/><circle cx="32" cy="32" r="9" fill="#fff9eb"/><circle cx="32" cy="32" r="3" fill="#7c3aed"/></svg>',
          );
        document.title = "[DEV] " + document.title;
      }
    </script>
    <link rel="stylesheet" href="./vendor/leaflet.css" />
    <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
    <script type="importmap">
      {
        "imports": {
          "leaflet": "./vendor/leaflet-module.js",
          "maplibre-gl": "./vendor/maplibre-gl.mjs"
        }
      }
    </script>
    <link rel="stylesheet" href="./vendor/MarkerCluster.css" />
    <link rel="stylesheet" href="./styles.css?v=20261002-details" />
    <script src="./config.js?v=20260924-hidden"></script>
    <script defer src="./vendor/leaflet.js"></script>
    <script defer src="./vendor/leaflet.markercluster.js"></script>
    <script type="module" src="./shared/entry.js?v=20261002-details"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to concerts</a>
    <div id="app">
      <div class="initial-loading" role="status" aria-live="polite">
        <div class="loading-record" aria-hidden="true"><img src="./favicon.svg" alt="" width="64" height="64"></div>
        <h1>Concert Tracker</h1>
        <p id="startup-status">Loading concerts…</p>
        <div class="loading-equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <button id="startup-retry" class="secondary" hidden onclick="location.reload()">Retry</button>
      </div>
    </div>
    <div id="detail-root"></div>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >Concert Tracker needs JavaScript to search, play recordings, and save
      concerts.</noscript
    >
  </body>
</html>
