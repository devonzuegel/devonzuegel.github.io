<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f7f5ef"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191e1b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Your personal concert shortlist. Find shows, watch live performances, and keep the nights you don’t want to miss."
    />
    <title>Encore — concerts worth seeing</title>
    <link rel="icon" href="./favicon.svg?v=record-e" type="image/svg+xml" />
    <script>
      // Localhost and private-network previews get a distinct violet tab icon.
      const localPreview =
        /^(localhost|.*\.localhost|127(?:\.\d{1,3}){3}|\[::1\]|10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})$/.test(
          location.hostname,
        );
      if (localPreview) {
        document.querySelector('link[rel="icon"]').href =
          "data:image/svg+xml," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#7c3aed"/><circle cx="32" cy="32" r="23" fill="none" stroke="#fff9eb" stroke-opacity=".55" stroke-width="1.8"/><circle cx="32" cy="32" r="18" fill="none" stroke="#fff9eb" stroke-opacity=".55" stroke-width="1.8"/><circle cx="32" cy="32" r="9" fill="#fff9eb"/><circle cx="32" cy="32" r="3" fill="#7c3aed"/></svg>',
          );
        document.title = "[DEV] " + document.title;
      }
    </script>
    <link rel="stylesheet" href="./vendor/leaflet.css" />
    <link rel="stylesheet" href="./vendor/MarkerCluster.css" />
    <link rel="stylesheet" href="./styles.css?v=20260919-accounts" />
    <script src="./config.js?v=20260919-accounts"></script>
    <script defer src="./vendor/leaflet.js"></script>
    <script defer src="./vendor/leaflet.markercluster.js"></script>
    <script type="module" src="./app.js?v=20260919-accounts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to concerts</a>
    <div id="app">
      <div class="initial-loading">
        <span class="wordmark">encore<span>✳</span></span>
        <p>Finding good nights.</p>
      </div>
    </div>
    <div id="detail-root"></div>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >Encore needs JavaScript to search, play recordings, and save
      concerts.</noscript
    >
  </body>
</html>
